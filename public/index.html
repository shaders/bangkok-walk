<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bangkok Walk</title>
<style>
  html, body { margin: 0; height: 100%; background: #07040f; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const FY = 0.92, CH = 0.30, SPEED = 0.2, ROPE = 0.30, SC = 0.13;
const G2 = 0.625, FS = 0.15, FAC = 0.8, SLOT = 1.4, CROSS = 14, STEPGAP = 21;
const NEON = [0xFFFF2D95, 0xFF00E5FF, 0xFFB44CFF, 0xFFFFD23F, 0xFF39FF88, 0xFFFF5A36];
const SKY_SIGNS = ["BANGKOK", "SIAM", "กรุงเทพ", "MBK", "ช้าง", "LEO", "ICONSIAM", "SINGHA"];
const SHOP_SIGNS = ["ร้านอาหาร", "ก๋วยเตี๋ยว", "โรงแรม", "ร้านยา", "NOODLE", "PHARMACY", "HOSTEL", "TATTOO", "ทองคำ", "EXCHANGE", "SIM CARD", "ข้าวมันไก่"];
const VSIGNS = ["酒吧", "按摩", "旅馆", "金店", "饭店", "บาร์", "นวด"];
const FACADE = [0xFF3A4A48, 0xFF5A4044, 0xFF5C5444, 0xFF44474E, 0xFF4E3E30, 0xFF3E4C38, 0xFF4A3A52];
const NAGS = ["Бля, чувак, нажми уже, идти", "Ну чё встал? Зажимай", "Музыка щас сдохнет, жми", "Я так до утра стоять буду?", "Зажми экран, ёпта"];
const WOWS = ["ебать...", "во дают", "красиво", "ну нихуя себе", "я бы тоже так смог", "щас бы туда", "ха, лох", "кино"];
const LIFTS = ["ну ёб твою мать", "щас подниму", "ну чё ты, малая", "вставай, родная"];
const FONT = "bold %px -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif";
const DEBUG = location.search.indexOf("debug") >= 0;

const cvs = document.getElementById("c");
const cv = cvs.getContext("2d");
let SW, SH, W, H, OY, dpr, dudeFrac;

let t = 0, last = 0;
let px = 0, camX = 0, phase = 0, amp = 0, bob = 0, speed = 0, drive = 0, everHeld = false, elevD = 0;
let sx = -ROPE, wheelRot = 0, sFace = 1, handX = 0, handY = 0;
let scooterDown = false, sRot = 0, downSince = 0, liftT = -1, sparkT = 0, scrapeT = 0;
let hasCig = false, lit = false, cigLen = 0, emberGlow = 0.35, lightT = -1, dragT = -1, idleSmoke = 0, nextDragAt = 0;
let hasBeer = false, opened = false, beerLevel = 0, openT = -1, sipT = -1, nextSipAt = 0;
let cigs = 0, beers = 0, meters = 0, drunk = 0;
let stopUntil = 0, nextActionAt = 1e9, redHold = 0, jayUntil = 0;
let bubbleText = "", bubbleUntil = 0;
const parts = [], bottles = [], watched = new Set(), stepHit = new Set(), crossDone = new Set(), crossSaid = new Set();
const pointers = new Set(), keysDown = new Set();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  SW = window.innerWidth; SH = window.innerHeight;
  cvs.width = Math.round(SW * dpr); cvs.height = Math.round(SH * dpr);
  W = SW;
  H = Math.min(SH, SW);
  OY = SH - H;
  dudeFrac = SW / H < 1.3 ? 0.42 : 0.38;
}
window.addEventListener("resize", resize);
resize();

function rnd(i, salt) {
  let h = Math.imul(i, 0x9E3779B1) ^ Math.imul(salt, 0x85EBCA77);
  h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
  h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
  h ^= h >>> 16;
  return (h & 0xFFFFFF) / 16777216;
}
const mod = (a, m) => { const r = a % m; return r < 0 ? r + m : r; };
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => clamp(v, 0, 1);
const smooth = k => { k = clamp01(k); return k * k * (3 - 2 * k); };
const sin = Math.sin, cos = Math.cos, PI = Math.PI;
const withA = (c, a) => ((c & 0xFFFFFF) | (clamp(a | 0, 0, 255) << 24)) >>> 0;
const pick = (arr, r) => arr[Math.min(arr.length - 1, (r * arr.length) | 0)];
function css(c) {
  return "rgba(" + ((c >>> 16) & 255) + "," + ((c >>> 8) & 255) + "," + (c & 255) + "," + (((c >>> 24) & 255) / 255).toFixed(3) + ")";
}
function font(px) { cv.font = FONT.replace("%", px.toFixed(1)); }
function fill(c) { cv.fillStyle = css(c); }
function stroke(c, w) { cv.strokeStyle = css(c); cv.lineWidth = w; cv.lineCap = "round"; cv.lineJoin = "round"; }
function rect(l, tt, r, b, c) { fill(c); cv.fillRect(l, tt, r - l, b - tt); }
function rrect(l, tt, r, b, rad, c) {
  fill(c); cv.beginPath();
  if (cv.roundRect) cv.roundRect(l, tt, r - l, b - tt, rad); else cv.rect(l, tt, r - l, b - tt);
  cv.fill();
}
function oval(l, tt, r, b, c) {
  fill(c); cv.beginPath();
  cv.ellipse((l + r) / 2, (tt + b) / 2, Math.abs(r - l) / 2, Math.abs(b - tt) / 2, 0, 0, PI * 2);
  cv.fill();
}
function circle(x, y, r, c) { fill(c); cv.beginPath(); cv.arc(x, y, Math.abs(r), 0, PI * 2); cv.fill(); }
function line(x0, y0, x1, y1, c, w) { stroke(c, w); cv.beginPath(); cv.moveTo(x0, y0); cv.lineTo(x1, y1); cv.stroke(); }
function glow(x, y, r, c, alpha) {
  if (r <= 0 || alpha <= 0) return;
  const g = cv.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, css(withA(c, alpha)));
  g.addColorStop(1, css(withA(c, 0)));
  cv.fillStyle = g;
  cv.beginPath(); cv.arc(x, y, r, 0, PI * 2); cv.fill();
}
function poly(pts, c) {
  fill(c); cv.beginPath(); cv.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) cv.lineTo(pts[i], pts[i + 1]);
  cv.closePath(); cv.fill();
}
function text(s, x, y, size, c, align, shadow) {
  font(size); cv.textAlign = align || "center"; cv.fillStyle = css(c);
  if (shadow) { cv.shadowColor = css(shadow[0]); cv.shadowBlur = shadow[1]; cv.shadowOffsetY = shadow[2] || 0; }
  cv.fillText(s, x, y);
  cv.shadowBlur = 0; cv.shadowOffsetY = 0; cv.shadowColor = "transparent";
}
function bubble(x, y, s, size, alpha) {
  if (alpha <= 0) return;
  font(size);
  const w = cv.measureText(s).width + size * 1.2, h = size * 1.7;
  const bx = clamp(x - w / 2, 4, SW - w - 4);
  const by = y - h - size * 0.6;
  cv.globalAlpha = clamp01(alpha);
  rrect(bx, by, bx + w, by + h, size * 0.6, 0xF2FFFFFF);
  poly([x - size * 0.4, by + h - 1, x + size * 0.4, by + h - 1, x, y], 0xF2FFFFFF);
  text(s, bx + w / 2, by + h * 0.68, size, 0xFF111111);
  cv.globalAlpha = 1;
}

// ---------------------------------------------------------------- world layout

function crossX(c) { return c * CROSS + 7 + rnd(c, 172) * 3; }
function isRed(c) { return mod(t + rnd(c, 170) * 12, 12) < 7; }
function lightLeft(c) { const p = mod(t + rnd(c, 170) * 12, 12); return p < 7 ? 7 - p : 12 - p; }
function nearCross(x, pad) { const c = Math.round((x - 8.5) / CROSS); return Math.abs(x - crossX(c)) < pad; }
function stepX(s) { return s * STEPGAP + 12 + rnd(s, 173) * 5; }
function validStep(s) { return !nearCross(stepX(s), 1.5) && !nearCross(stepX(s) + 0.5, 1.5); }
function onStep(x) {
  const s = Math.floor((x - 12) / STEPGAP);
  for (const k of [s - 1, s, s + 1]) { const xs = stepX(k); if (validStep(k) && x >= xs && x <= xs + 0.5) return true; }
  return false;
}

// ---------------------------------------------------------------- stickmen

// pose: [lean, thighA, kneeA, thighB, kneeB, armA, elbowA, armB, elbowB, crouch, fallBack, headTilt]
const STAND = [0, -0.05, 0.05, 0.05, 0.05, -0.1, 0.2, 0.1, 0.2, 0, 0, 0];
const PUNCH = [0.25, -0.45, 0.35, 0.35, 0.3, 0.5, 2.0, 1.57, 0, 0.06, 0, 0];
const KICK = [-0.35, -0.1, 0.1, 1.75, 0, 0.9, 1.0, 1.4, 0.4, 0, 0, 0];
const FLY = [-0.15, -0.6, 1.6, 1.45, 0, 1.6, 0.4, -0.6, 0.8, -0.28, 0, 0];
const HIT = [-0.5, 0.4, 0.6, 0.2, 0.2, 1.4, 0.4, 1.8, 0.3, 0, 0, 0];
const LIE = [0, 0.1, 0, -0.1, 0, 2.6, 0.2, 2.2, 0.4, 0, 1.5, 0];
const BOW = [0.9, 0, 0, 0, 0, 0.3, 0, 0.3, 0, 0, 0, 0.3];
const SIT = [0, 1.57, 1.57, 1.5, 1.5, 0.9, 0.6, 1.1, 0.5, 0.25, 0, 0];
const DRINK = [-0.15, -0.05, 0.05, 0.05, 0.05, 0.1, 0.3, 2.3, 2.5, 0, 0, -0.35];

function lerpP(a, b, k) { const r = new Array(12); for (let i = 0; i < 12; i++) r[i] = lerp(a[i], b[i], k); return r; }
function walkP(ph, run) {
  const s = sin(ph), m = run ? 1.8 : 1;
  return [run ? 0.3 : 0.05, 0.4 * s * m, 0.15 + 0.4 * m * Math.max(0, sin(ph + 1.6)), -0.4 * s * m, 0.15 + 0.4 * m * Math.max(0, sin(ph + 1.6 + PI)),
    -0.4 * s * m, run ? 1.4 : 0.3, 0.4 * s * m, run ? 1.4 : 0.3, -Math.abs(cos(ph)) * 0.02, 0, 0];
}
function fightP(ph) { return [0.12, -0.35, 0.45, 0.3, 0.35, 0.7, 1.9, 1.1, 1.5, 0.05 + 0.015 * sin(ph * 7), 0, 0]; }
function danceP(ph, style) {
  const s = sin(ph), c = cos(ph);
  if (style === 0) return [0.1 * s, 0.15 * s, 0.2, -0.15 * s, 0.2, 2.7 + 0.35 * s, 0.3, 2.7 - 0.35 * s, 0.3, 0.03 * (1 + sin(ph * 2)), 0, 0.15 * s];
  if (style === 1) {
    const up = sin(ph * 0.5) > 0;
    return [0.05, 0.25 * s, 0.2, -0.1, 0.1, up ? 2.6 : 0.5, 0.1, up ? 0.3 : 2.6, 0.1, 0.02, 0, 0.1 * c];
  }
  if (style === 2) return [0.2 * s, 0.5, 0.9 + 0.3 * s, -0.2, 0.9 - 0.3 * s, 1.2 + 0.6 * s, 1.5, 1.2 - 0.6 * s, 1.5, 0.12 + 0.05 * s, 0, 0];
  return [0.1 * c, 0.3 * s, 0.4, -0.3 * s, 0.4, 1.6 + 0.8 * c, 0.4, 1.6 - 0.8 * c, 0.4, 0.04 * Math.abs(s), 0, 0.2 * c];
}
function cheerP(ph) { return [0, -0.05, 0.1, 0.05, 0.1, 2.8 + 0.2 * sin(ph * 2), 0.2, 2.8 - 0.2 * sin(ph * 2), 0.2, -0.04 * Math.abs(sin(ph * 2)), 0, -0.2]; }
function waveP(ph) { return [0, -0.05, 0.05, 0.05, 0.05, 0.2, 0.3, 2.6, 0.4 + 0.5 * sin(ph * 8), 0, 0, 0]; }
function singP(ph) { return [0.1 * sin(ph), -0.1, 0.1, 0.1, 0.1, 1.6 + 0.5 * sin(ph * 1.3), 0.3, 1.0, 2.3, 0, 0, -0.15]; }
function batonP(ph) { return [0.3, -0.4, 0.3, 0.3, 0.3, 0.3, 0.5, 1.9 + 1.0 * cos(ph), 0.3, 0.04, 0, 0.2]; }

function figure(x, y, s, P, f, col, ex) {
  ex = ex || {};
  cv.save();
  cv.translate(x, y);
  cv.scale(f * s, s);
  if (P[10]) cv.rotate(-P[10]);
  const lw = 0.065;
  const hx = 0, hy = -0.5 + P[9];
  stroke(col, lw);
  for (const [tt, kk] of [[P[1], P[2]], [P[3], P[4]]]) {
    const kx = hx + sin(tt) * 0.26, ky = hy + cos(tt) * 0.26;
    const fx = kx + sin(tt - kk) * 0.26, fy = ky + cos(tt - kk) * 0.26;
    cv.beginPath(); cv.moveTo(hx, hy); cv.lineTo(kx, ky); cv.lineTo(fx, fy); cv.stroke();
  }
  const nx = hx + sin(P[0]) * 0.3, ny = hy - cos(P[0]) * 0.3;
  if (ex.bag) rrect(nx - 0.13 * cos(P[0]) - 0.04, ny + 0.02, nx - 0.02, ny + 0.2, 0.03, ex.bag);
  if (ex.robe) {
    stroke(ex.robe, 0.16);
    cv.beginPath(); cv.moveTo(hx, hy + 0.12); cv.lineTo(nx, ny + 0.03); cv.stroke();
  } else if (ex.shirt) {
    stroke(ex.shirt, 0.12);
    cv.beginPath(); cv.moveTo(hx, hy); cv.lineTo(nx, ny + 0.04); cv.stroke();
  } else {
    stroke(col, lw);
    cv.beginPath(); cv.moveTo(hx, hy); cv.lineTo(nx, ny); cv.stroke();
  }
  if (ex.skirt) poly([hx - 0.05, hy - 0.04, hx + 0.05, hy - 0.04, hx + 0.12, hy + 0.13, hx - 0.12, hy + 0.13], ex.skirt);
  const hands = [];
  for (const [a, e] of [[P[5], P[6]], [P[7], P[8]]]) {
    const ex1 = nx + sin(a) * 0.17, ey1 = ny + cos(a) * 0.17;
    const hx2 = ex1 + sin(a + e) * 0.17, hy2 = ey1 + cos(a + e) * 0.17;
    stroke(ex.shirt && !ex.robe ? ex.shirt : col, lw);
    cv.beginPath(); cv.moveTo(nx, ny); cv.lineTo(ex1, ey1); cv.lineTo(hx2, hy2); cv.stroke();
    hands.push([hx2, hy2, a + e]);
  }
  const hcX = nx + sin(P[0] + P[11]) * 0.1, hcY = ny - cos(P[0] + P[11]) * 0.1;
  circle(hcX, hcY, 0.075, col);
  if (ex.hat === "cop") { rect(hcX - 0.08, hcY - 0.09, hcX + 0.08, hcY - 0.04, 0xFF20304A); rect(hcX - 0.02, hcY - 0.06, hcX + 0.11, hcY - 0.04, 0xFF20304A); }
  if (ex.hat === "sun") oval(hcX - 0.14, hcY - 0.08, hcX + 0.14, hcY - 0.03, 0xFFE8D8A0);
  if (ex.hair) { fill(ex.hair); cv.beginPath(); cv.arc(hcX, hcY, 0.08, PI * 0.9, PI * 2.1); cv.fill(); line(hcX - 0.06, hcY, hcX - 0.09, hcY + 0.14, ex.hair, 0.05); }
  const [rx, ry, ra] = hands[1];
  if (ex.bottle) {
    cv.save(); cv.translate(rx, ry); cv.rotate(-ra + PI);
    rrect(-0.025, -0.06, 0.025, 0.07, 0.01, 0xE01B6B32); rect(-0.009, -0.12, 0.009, -0.06, 0xE01B6B32);
    cv.restore();
  }
  if (ex.mic) { line(rx, ry, rx + sin(ra) * 0.08, ry + cos(ra) * 0.08, 0xFF333333, 0.03); circle(rx + sin(ra) * 0.1, ry + cos(ra) * 0.1, 0.03, 0xFF888888); }
  if (ex.baton) line(rx, ry, rx + sin(ra) * 0.26, ry + cos(ra) * 0.26, 0xFF111111, 0.035);
  if (ex.selfie) {
    const sx2 = rx + sin(ra) * 0.45, sy2 = ry + cos(ra) * 0.45;
    line(rx, ry, sx2, sy2, 0xFF999999, 0.015);
    rrect(sx2 - 0.04, sy2 - 0.06, sx2 + 0.04, sy2 + 0.06, 0.01, 0xFF222222);
    glow(sx2, sy2, 0.12, 0xFFFFFFFF, 120);
  }
  if (ex.bowl) oval(hands[0][0] - 0.05, hands[0][1] - 0.03, hands[0][0] + 0.05, hands[0][1] + 0.03, 0xFF2A2A2A);
  cv.restore();
}

// ---------------------------------------------------------------- input

function muteBtn() {
  const hs = Math.min(SW, SH);
  return { x: SW - 0.08 * hs, y: 0.08 * hs, r: 0.05 * hs };
}
function inMute(x, y) { const b = muteBtn(), dx = x - b.x, dy = y - b.y; return dx * dx + dy * dy < b.r * b.r * 2; }
function isHolding() { return pointers.size > 0 || keysDown.size > 0; }

cvs.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (inMute(e.clientX, e.clientY)) { toggleMute(); return; }
  initAudio();
  pointers.add(e.pointerId);
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
});
const up = e => pointers.delete(e.pointerId);
cvs.addEventListener("pointerup", up);
cvs.addEventListener("pointercancel", up);
cvs.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "m" || k === "ь") { if (!e.repeat) toggleMute(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  initAudio();
  keysDown.add(k);
  e.preventDefault();
});
window.addEventListener("keyup", e => keysDown.delete(e.key.toLowerCase()));
window.addEventListener("blur", () => { keysDown.clear(); pointers.clear(); });

// ---------------------------------------------------------------- dude logic

const wx = lx => px + lx * CH;
const wy = ly => FY + bob + ly * CH;
const curve = (x, upDur, downAt, downDur) => smooth(x / upDur) * (1 - smooth((x - downAt) / downDur));

function lift() {
  if (lightT >= 0) return curve(lightT, 0.3, 1.15, 0.3);
  if (sipT >= 0) return curve(sipT, 0.35, 1.3, 0.35);
  if (dragT >= 0 && !hasBeer) return curve(dragT, 0.3, 0.9, 0.3);
  return 0;
}

function addPart(x, y, vx, vy, life, s0, s1, alpha, kind, col) {
  parts.push({ x, y, vx, vy, age: 0, life, s0, s1, alpha, kind, col: col || 0xC8C8D2 });
}

function puff(n) {
  sfxExhale(n > 12);
  const mx = wx(0.13), my = wy(-0.89);
  for (let i = 0; i < n; i++) {
    addPart(mx, my, 0.03 + Math.random() * 0.05, -0.008 - Math.random() * 0.025,
      2 + Math.random() * 1.8, 0.008, 0.05 + Math.random() * 0.04, 0.32, 0);
  }
}

function say(s, dur) { bubbleText = s; bubbleUntil = t + dur; }

function startSmoke() { lightT = 0; stopUntil = Math.max(stopUntil, t + 2.2); nextDragAt = t + 4.5; }
function startBeer() { openT = 0; hasBeer = true; opened = false; beerLevel = 1; stopUntil = Math.max(stopUntil, t + 2.4); nextSipAt = t + 1.5; }

function flick() {
  hasCig = false; lit = false;
  addPart(wx(0.13 + 0.08 * cigLen), wy(-0.885), 0.35, -0.35, 5, 0.004, 0.004, 1, 1);
}

function eventX(j) { return (j * SLOT + SLOT / 2 - camX * FAC) * H; }

function crossingBlock(holding) {
  let blocked = false;
  const ci = Math.floor((px - 7) / CROSS);
  for (const c of [ci, ci + 1]) {
    if (crossDone.has(c)) continue;
    const stopX = crossX(c) - 0.5;
    if (px > stopX + 0.01) { crossDone.add(c); continue; }
    if (px < stopX - 0.45) continue;
    if (isRed(c) && t > jayUntil) {
      blocked = true;
      if (px > stopX) px = stopX;
      if (!crossSaid.has(c)) { crossSaid.add(c); say("красный, стоим", 2); redHold = 0; }
      if (holding) redHold += lastDt;
      if (redHold > 3.5) {
        crossDone.add(c); redHold = 0; jayUntil = t + 2.5; blocked = false;
        sfxHonk(); say("да похуй, бегом!", 2);
      }
    } else if (crossSaid.has(c) && t > jayUntil) {
      crossDone.add(c); redHold = 0; say("зелёный, погнали", 1.5);
    }
  }
  return blocked;
}

let lastDt = 0.016;
function update(dt) {
  lastDt = dt;
  t += dt;
  const holding = isHolding();
  if (holding) {
    if (!everHeld) { everHeld = true; nextActionAt = t + 7; }
    drive = 1;
  } else {
    drive = Math.max(0, drive - dt / 3.5);
  }
  const blocked = crossingBlock(holding);
  let target = t < stopUntil || blocked ? 0 : drive;
  if (t < jayUntil) target = 1.9 * drive;
  speed += (target - speed) * Math.min(1, dt * (target < speed && (t < stopUntil || blocked) ? 5 : 3));
  if (speed < 0.002) speed = 0;
  const v = SPEED * speed;
  px += v * dt;
  meters += v * dt * 5.7;
  phase += dt * 6.5 * Math.min(1.6, speed * 1.4);
  amp += (Math.min(1, speed * 1.6) - amp) * Math.min(1, dt * 6);
  if (amp < 0.02) phase = lerp(phase, Math.round(phase / PI) * PI, Math.min(1, dt * 4));
  elevD += ((onStep(px) ? -0.02 : 0) - elevD) * Math.min(1, dt * 12);
  bob = -Math.abs(cos(phase)) * 0.012 * amp + elevD;
  camX = px - dudeFrac * W / H;

  const dx = px - sx, old = sx;
  if (Math.abs(dx) > ROPE) sx = px - Math.sign(dx) * ROPE;
  if (sx !== old) {
    sFace = sx > old ? 1 : -1;
    if (!scooterDown) wheelRot += (sx - old) / (0.09 * SC);
    const s0 = Math.floor((sx - 12) / STEPGAP);
    for (const s of [s0, s0 + 1]) {
      const xs = stepX(s);
      if (validStep(s) && !stepHit.has(s) && old < xs && sx >= xs && !scooterDown) {
        stepHit.add(s); scooterDown = true; downSince = t;
        sfxClunk(); setTimeout(() => say("бля, веспа!", 1.8), 350);
      }
    }
    if (scooterDown && liftT < 0) {
      sparkT -= dt; scrapeT -= dt;
      if (sparkT < 0) {
        sparkT = 0.04;
        addPart(sx - 0.05 + Math.random() * 0.04, FY - 0.005, -(0.05 + Math.random() * 0.2), -0.15 - Math.random() * 0.25, 0.35, 0, 0, 1, 3);
      }
      if (scrapeT < 0) { scrapeT = 0.22; sfxScrape(); }
    }
  }
  if (scooterDown && liftT < 0 && t - downSince > 1.2 && (speed < 0.05 || t - downSince > 9)) {
    liftT = 0; stopUntil = Math.max(stopUntil, t + 2.4); say(pick(LIFTS, Math.random()), 2);
  }
  if (liftT >= 0) { liftT += dt; if (liftT > 2.0) { liftT = -1; scooterDown = false; } }
  const sTarget = scooterDown ? (liftT >= 0 ? 1 - smooth((liftT - 0.6) / 1.0) : 1) : 0;
  sRot += (sTarget - sRot) * Math.min(1, dt * 9);

  if (holding && t > stopUntil && !blocked) {
    const dX = (px - camX) * H;
    const j0 = Math.floor((camX * FAC) / SLOT) - 1;
    for (let j = j0; j < j0 + 6; j++) {
      if (watched.has(j) || eventType(j) < 0) continue;
      const rel = eventX(j) - dX;
      if (rel > 0.05 * H && rel < 0.3 * H) {
        watched.add(j);
        if (Math.random() < 0.8) {
          stopUntil = t + 4.5 + Math.random() * 2.5;
          setTimeout(() => say(pick(WOWS, Math.random()), 2.5), 1200);
          if (!hasCig && !hasBeer && Math.random() < 0.35) Math.random() < 0.5 ? startSmoke() : startBeer();
        }
        break;
      }
    }
  }
  if (holding && t > nextActionAt && t > stopUntil) {
    if (!hasCig && lightT < 0 && (hasBeer || Math.random() < 0.55)) startSmoke();
    else if (!hasBeer) startBeer();
    nextActionAt = t + 14 + Math.random() * 14;
  }

  if (lightT >= 0) {
    if (lightT < 0.4 && lightT + dt >= 0.4) sfxLighter();
    lightT += dt;
    if (lightT >= 0.3 && !hasCig) { hasCig = true; cigLen = 1; cigs++; }
    if (lightT >= 1.0 && !lit) { lit = true; emberGlow = 1; }
    if (lightT > 1.5) { lightT = -1; puff(10); }
  }
  if (lit && dragT < 0 && sipT < 0 && t > nextDragAt) { dragT = 0; nextDragAt = t + 3.5 + Math.random() * 3; }
  if (dragT >= 0) {
    const prev = dragT;
    dragT += dt;
    if (dragT > 0.35 && dragT < 0.95) { emberGlow = 1; cigLen -= dt * 0.15; }
    if (prev < 1.2 && dragT >= 1.2) puff(16);
    if (dragT > 1.7) dragT = -1;
  }
  if (lit) {
    cigLen -= dt * 0.02;
    if (cigLen < 0.22 && dragT < 0) flick();
  }
  emberGlow += (0.35 - emberGlow) * Math.min(1, dt * 2);
  if (lit) {
    idleSmoke -= dt;
    if (idleSmoke < 0) {
      idleSmoke = 0.1;
      addPart(wx(0.13 + 0.08 * cigLen), wy(-0.885), (Math.random() - 0.5) * 0.01, -0.035, 2.6, 0.003, 0.02, 0.2, 0);
    }
  }

  if (openT >= 0) {
    const prev = openT;
    openT += dt;
    if (prev < 0.7 && openT >= 0.7) {
      opened = true;
      sfxOpen();
      for (let i = 0; i < 8; i++) addPart(wx(0.08), wy(-0.58), (Math.random() - 0.5) * 0.04, -0.03 - Math.random() * 0.03, 0.6, 0.004, 0.01, 0.8, 0, 0xFFFFF4D8);
    }
    if (openT > 1.3) openT = -1;
  }
  if (hasBeer && opened && sipT < 0 && dragT < 0 && openT < 0 && t > nextSipAt) { sipT = 0; nextSipAt = t + 4 + Math.random() * 4; }
  if (sipT >= 0) {
    const prev = sipT;
    sipT += dt;
    for (const g of [0.55, 0.85, 1.15]) if (prev < g && sipT >= g) sfxGlug();
    if (sipT > 0.35 && sipT < 1.3) { beerLevel -= dt * 0.2; drunk += dt * 0.16; }
    if (sipT > 1.7) {
      sipT = -1;
      if (beerLevel <= 0.05) {
        hasBeer = false; opened = false; beers++;
        bottles.push(px + 0.05);
        if (bottles.length > 40) bottles.shift();
        if (Math.random() < 0.6) setTimeout(() => { sfxBurp(); say("ыыгх", 1.5); }, 500);
      }
    }
  }
  drunk = Math.max(0, drunk - dt * 0.012);

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.age += dt;
    if (q.age > q.life) { parts.splice(i, 1); continue; }
    if (q.kind === 0) {
      q.vx = q.vx * (1 - dt * 0.8) - 0.006 * dt;
      q.vy *= (1 - dt * 0.2);
      q.x += q.vx * dt + sin(t * 2 + q.life * 10) * 0.004 * dt;
      q.y += q.vy * dt;
    } else {
      q.vy += 1.3 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.kind === 1 && q.y > FY + 0.01) { q.y = FY + 0.01; q.vy *= -0.3; q.vx *= 0.5; }
    }
  }

  updateMusic(holding);
}

// ---------------------------------------------------------------- frame

function frame(ts) {
  const dt = last === 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);

  cv.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky();
  cv.save();
  cv.translate(0, OY);
  const dz = Math.min(drunk, 3);
  if (dz > 0.05) {
    cv.translate(W / 2, H * 0.9);
    cv.rotate(sin(t * 0.55) * 0.014 * dz);
    cv.translate(-W / 2 + sin(t * 0.8) * 0.01 * H * dz, -H * 0.9);
  }
  drawSkyline();
  drawFacades();
  drawEvents();
  drawRoad();
  drawWalk();
  drawCrossings();
  drawSteps();
  drawPoles();
  drawProps();
  drawBottles();
  drawScooter();
  drawDude();
  drawRope();
  drawParts();
  drawDudeBubble();
  cv.restore();
  const v = cv.createRadialGradient(SW / 2, SH / 2, 0, SW / 2, SH / 2, Math.max(SW, SH) * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(0.6, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)");
  cv.fillStyle = v; cv.fillRect(0, 0, SW, SH);
  drawHud();
  requestAnimationFrame(frame);
}

function drawSky() {
  const g = cv.createLinearGradient(0, 0, 0, OY + H * 0.5);
  g.addColorStop(0, "#07040F"); g.addColorStop(0.6, "#1A0C2E"); g.addColorStop(1, "#52182E");
  cv.fillStyle = g; cv.fillRect(0, 0, SW, OY + H * 0.62);
  glow(W * 0.8, H * 0.08, H * 0.1, 0xFFFFE6C8, 45);
  circle(W * 0.8, H * 0.08, H * 0.025, 0xFFE8DCC8);
}

function drawSkyline() {
  const off = camX * 0.15, slot = 0.16, top0 = -OY / H;
  const i0 = Math.floor(off / slot) - 2, i1 = i0 + Math.floor(W / H / slot) + 4;
  for (let i = i0; i <= i1; i++) {
    const x0 = (i * slot - off) * H, w = (0.10 + rnd(i, 1) * 0.07) * H;
    const h = (0.2 + rnd(i, 2) * (0.4 - top0 * 0.8)) * H;
    const top = 0.5 * H - h, r3 = rnd(i, 3);
    fill(0xFF000000 | ((20 + (r3 * 16 | 0)) << 16) | ((16 + (r3 * 10 | 0)) << 8) | (36 + (r3 * 22 | 0)));
    cv.fillRect(x0, top, w, 0.5 * H - top);
    let col = 0;
    for (let cx = x0 + 0.012 * H; cx < x0 + w - 0.012 * H; cx += 0.018 * H, col++) {
      let row = 0;
      for (let cy = top + 0.015 * H; cy < 0.48 * H; cy += 0.026 * H, row++) {
        const r = rnd(i * 131 + col, row);
        if (r > 0.6) rect(cx, cy, cx + 0.008 * H, cy + 0.012 * H, r > 0.9 ? 0x8896E6FF : 0x88FFD28C);
      }
    }
    if (rnd(i, 4) > 0.7) line(x0, top, x0 + w, top, withA(pick(NEON, rnd(i, 8)), 150 + 80 * sin(t * 1.5 + i)), 0.004 * H);
    if (rnd(i, 5) > 0.6 && sin(t * 3 + i) > 0) glow(x0 + w / 2, top - 0.01 * H, 0.012 * H, 0xFFFF2020, 230);
    if (rnd(i, 6) > 0.75) {
      const nc = pick(NEON, rnd(i, 9));
      text(pick(SKY_SIGNS, rnd(i, 7)), x0 + w / 2, top + 0.04 * H, 0.028 * H, nc, "center", [nc, 0.012 * H]);
    }
  }
}

// ---------------------------------------------------------------- facades

function drawFacades() {
  const topLimit = -OY / H - 0.1, off = camX * FAC, slot = 0.6;
  const i0 = Math.floor(off / slot) - 1, i1 = i0 + Math.floor(W / H / slot) + 3;
  for (let i = i0; i <= i1; i++) {
    const x0 = (i * slot - off) * H, w = slot * H;
    const tower = rnd(i, 91) > 0.82;
    const floors = tower ? 8 + ((rnd(i, 92) * 9) | 0) : 2 + ((rnd(i, 93) * 5) | 0);
    const fh = 0.16, base = 0.45;
    const topY = base - fh * floors;
    const bw = tower ? w * 0.85 : w;
    const bx = tower ? x0 + w * 0.075 : x0;
    const col = pick(FACADE, rnd(i, 94));
    rect(bx, topY * H, bx + bw, 0.6 * H, col);
    rect(bx, topY * H, bx + 0.012 * H, 0.6 * H, 0x33000000);
    rect(bx + bw - 0.012 * H, topY * H, bx + bw, 0.6 * H, 0x22FFFFFF);
    if (!tower && rnd(i, 95) > 0.7 && topY > topLimit) rooftop(bx, bw, topY, i);
    for (let k = 1; k <= floors; k++) {
      const fy = base - fh * k;
      if ((fy + fh) < topLimit) continue;
      line(bx, (fy + fh) * H, bx + bw, (fy + fh) * H, 0x33000000, 0.006 * H);
      const nwin = Math.max(2, Math.floor(bw / H / 0.15));
      for (let n = 0; n < nwin; n++) floorWindow(bx + (n + 0.5) * bw / nwin, fy, i * 31 + k * 7 + n);
      if (rnd(i * 13 + k, 96) > 0.62) balcony(bx, bw, fy, i * 13 + k);
    }
    if (rnd(i, 97) > 0.6) {
      const nc = pick(NEON, rnd(i, 98)), vx = bx + bw - 0.05 * H;
      const vy0 = (base - fh * Math.min(floors, 2)) * H + 0.02 * H, vy1 = base * H - 0.01 * H;
      rect(vx, vy0, vx + 0.04 * H, vy1, 0xDD100810);
      stroke(withA(nc, 200 + 55 * sin(t * 4 + i)), 0.003 * H);
      cv.strokeRect(vx, vy0, 0.04 * H, vy1 - vy0);
      const ch = pick(VSIGNS, rnd(i, 99));
      for (let c = 0; c < ch.length; c++) text(ch[c], vx + 0.02 * H, vy0 + (c + 1) * 0.045 * H, 0.032 * H, nc, "center", [nc, 0.01 * H]);
    }
    groundFloor(bx, bw, i);
  }
}

function groundFloor(bx, bw, i) {
  const top = 0.45 * H, bot = 0.6 * H, open = rnd(i, 100) > 0.4;
  rect(bx + 0.01 * H, top + 0.04 * H, bx + bw - 0.01 * H, bot, open ? 0xFF2A2018 : 0xFF181818);
  if (open) {
    glow(bx + bw / 2, top + 0.1 * H, bw * 0.6, 0xFFFFC070, 70);
    for (let k = 0; k < 4; k++) rect(bx + bw * (0.15 + k * 0.2), top + 0.11 * H, bx + bw * (0.25 + k * 0.2), top + 0.13 * H, 0x55D8C8A0);
  } else {
    for (let y = top + 0.05 * H; y < top + 0.1 * H; y += 0.008 * H) line(bx + 0.015 * H, y, bx + bw - 0.015 * H, y, 0x33AAAAAA, 0.002 * H);
  }
  const sc = pick([0xFFC81E1E, 0xFF1E5AC8, 0xFFE0A020, 0xFF1E9E4A, 0xFFE8E8E8], rnd(i, 101));
  rect(bx + 0.005 * H, top, bx + bw - 0.005 * H, top + 0.04 * H, sc);
  text(pick(SHOP_SIGNS, rnd(i, 102)), bx + bw / 2, top + 0.03 * H, 0.024 * H, sc === 0xFFE8E8E8 || sc === 0xFFE0A020 ? 0xFF201010 : 0xFFFFFFFF);
  rect(bx, bot, bx + bw, 0.64 * H, 0xFF4A4A50);
  line(bx, 0.64 * H, bx + bw, 0.64 * H, 0xFF6A6A70, 0.004 * H);
}

function floorWindow(cx, fy, id) {
  const ww = 0.075 * H, wh = 0.085 * H, x0 = cx - ww / 2, y0 = (fy + 0.035) * H;
  const r = rnd(id, 110);
  if (r < 0.45) { rect(x0, y0, x0 + ww, y0 + wh, 0xFF141820); return; }
  const tv = r > 0.88;
  const lc = tv ? (sin(t * 9 + id) > 0.3 ? 0xFF6A9AE8 : 0xFF4A70C0) : (rnd(id, 111) > 0.3 ? 0xFFE8B868 : 0xFFE88A9A);
  rect(x0, y0, x0 + ww, y0 + wh, lc);
  glow(cx, y0 + wh / 2, ww * 1.1, lc, 50);
  const act = rnd(id, 112);
  if (act > 0.45 && !tv) {
    cv.save();
    cv.beginPath(); cv.rect(x0, y0, ww, wh); cv.clip();
    const lt = t + rnd(id, 113) * 20, sil = 0xEE1A1014, s = wh * 0.95, gy = y0 + wh * 1.02;
    if (act < 0.62) figure(cx, gy, s, danceP(lt * 5, ((rnd(id, 114) * 4) | 0)), 1, sil);
    else if (act < 0.76) {
      const yell = sin(lt * 2.2) > 0;
      figure(cx - ww * 0.25, gy, s, yell ? waveP(lt) : STAND, 1, sil);
      figure(cx + ww * 0.25, gy, s, yell ? STAND : waveP(lt + 1), -1, sil);
    } else if (act < 0.88) figure(cx, gy, s, sin(lt) > 0.3 ? DRINK : STAND, 1, sil, { bottle: true });
    else figure(cx, gy, s, lerpP(STAND, SIT, 0.5 + 0.5 * sin(lt * 3)), 1, sil);
    cv.restore();
  }
  line(x0, y0 + wh / 2, x0 + ww, y0 + wh / 2, 0x55000000, 0.003 * H);
  line(cx, y0, cx, y0 + wh, 0x55000000, 0.003 * H);
}

function balcony(bx, bw, fy, id) {
  const y = (fy + 0.16) * H, rl = y - 0.04 * H, x0 = bx + 0.02 * H, x1 = bx + bw - 0.02 * H;
  if (rnd(id, 120) > 0.5) {
    stroke(0xFF2A2A2A, 0.002 * H);
    cv.beginPath(); cv.moveTo(x0, y - 0.11 * H); cv.quadraticCurveTo((x0 + x1) / 2, y - 0.09 * H, x1, y - 0.11 * H); cv.stroke();
    for (let k = 0; k < 4; k++) {
      const cx = lerp(x0, x1, 0.2 + k * 0.2), c = pick([0xFFC83030, 0xFFE8E8E8, 0xFF3060C8, 0xFFE8C030], rnd(id * 5 + k, 121));
      rect(cx - 0.012 * H, y - 0.105 * H, cx + 0.012 * H, y - 0.075 * H + sin(t * 2 + k) * 0.002 * H, c);
    }
  }
  if (rnd(id, 122) > 0.55) rect(x1 - 0.06 * H, y - 0.075 * H, x1 - 0.01 * H, y - 0.04 * H, 0xFFB0B0A8);
  if (rnd(id, 123) > 0.6) {
    const lt = t + rnd(id, 124) * 30, smoker = rnd(id, 125) > 0.5, cx = lerp(x0, x1, 0.35);
    figure(cx, y, 0.11 * H, smoker ? [0.1, 0, 0, 0, 0, 0.6, 1.0, sin(lt * 0.7) > 0.6 ? 2.3 : 1.2, 1.4, 0, 0, 0] : [0, 0.1, 0.1, -0.1, 0.1, 0.9, 1.5, 1.0, 1.5, 0, 0, 0.1 * sin(lt * 3)], 1, 0xFFD8D0C8);
    if (smoker) {
      glow(cx + 0.025 * H, y - 0.085 * H, 0.008 * H, 0xFFFF6A1A, 200);
      for (let k = 0; k < 3; k++) {
        const m = mod(lt * 0.3 + k / 3, 1);
        circle(cx + 0.025 * H + sin(m * 6) * 0.01 * H, y - (0.09 + m * 0.08) * H, (0.005 + m * 0.015) * H, withA(0xC8C8D2, 70 * (1 - m)));
      }
    } else {
      rrect(cx + 0.005 * H, y - 0.07 * H, cx + 0.045 * H, y - 0.05 * H, 0.008 * H, 0xFF8A5A30);
      if (mod(lt, 3) < 1.5) text("♪", cx + 0.03 * H, y - 0.13 * H - mod(lt, 1.5) * 0.03 * H, 0.025 * H, 0xCCFFFFFF);
    }
  }
  rect(x0 - 0.01 * H, rl, x1 + 0.01 * H, rl + 0.006 * H, 0xFF2A2A30);
  for (let x = x0; x <= x1; x += 0.02 * H) line(x, rl, x, y, 0xFF2A2A30, 0.003 * H);
  rect(x0 - 0.01 * H, y - 0.004 * H, x1 + 0.01 * H, y + 0.006 * H, 0xFF333338);
}

function rooftop(bx, bw, topY, i) {
  const y = topY * H;
  stroke(0xFF222222, 0.002 * H);
  cv.beginPath(); cv.moveTo(bx, y - 0.1 * H); cv.quadraticCurveTo(bx + bw / 2, y - 0.06 * H, bx + bw, y - 0.1 * H); cv.stroke();
  for (let k = 0; k < 9; k++) {
    const kk = k / 8, lx = bx + bw * kk, ly = y - 0.1 * H + sin(kk * PI) * 0.04 * H;
    circle(lx, ly, 0.005 * H, pick(NEON, rnd(i * 9 + k, 130)));
  }
  for (let k = 0; k < 2; k++) {
    const a = -PI / 2 + sin(t * 0.9 + k * 2 + i) * 0.6, lx = bx + bw * (0.3 + k * 0.4);
    line(lx, y, lx + cos(a) * H, y + sin(a) * H, withA(k ? 0xFF39FF88 : 0xFFFF2D95, 70), 0.004 * H);
  }
  for (let k = 0; k < 3; k++) figure(bx + bw * (0.25 + k * 0.25), y, 0.1 * H, danceP(t * 5 + k * 2 + i, (k + i) & 3), 1, 0xFF0C0810);
  rect(bx, y - 0.015 * H, bx + bw, y, 0xFF1A1A1E);
}

// ---------------------------------------------------------------- events

const EVENTS = [evKungfu, evMuayThai, evGogo, evKaraoke, evBeerTable, evMassage, evCops, evTuktuk, evMonks, evElephant, evRelocant, evTiktok, evBrawl];

function eventType(j) {
  if (rnd(j, 140) < 0.08) return -1;
  return (rnd(j, 141) * EVENTS.length) | 0;
}

function drawEvents() {
  const off = camX * FAC;
  const j0 = Math.floor(off / SLOT) - 1, j1 = j0 + Math.floor(W / H / SLOT) + 3;
  for (let j = j0; j <= j1; j++) {
    const ty = eventType(j);
    if (ty < 0) continue;
    const cx = eventX(j);
    if (cx < -0.8 * H || cx > W + 0.8 * H) continue;
    EVENTS[ty](cx, j, t + rnd(j, 142) * 30);
  }
}

const S_ = () => FS * H;
const GY = () => G2 * H;
const FG = 0xFFEDEDED;

function evKungfu(cx, j, lt) {
  const c = mod(lt, 9), U = H, S = S_(), G = GY();
  let hX = 0, hP = fightP(lt), hF = 1;
  if (c >= 1 && c < 1.45) { const k = (c - 1) / 0.45; hP = lerpP(fightP(lt), FLY, smooth(k * 2)); hX = 0.1 * k; hP[9] = -0.28 * sin(PI * k); }
  else if (c >= 1.45 && c < 2.2) { const k = (c - 1.45) / 0.75; hP = lerpP(FLY, fightP(lt), smooth(k)); hX = 0.1 * (1 - k); hP[9] = 0; }
  else if (c >= 2.2 && c < 3.2) { hF = -1; hP = c < 2.9 ? lerpP(fightP(lt), KICK, smooth((c - 2.2) / 0.45)) : lerpP(KICK, fightP(lt), smooth((c - 2.9) / 0.3)); }
  else if (c >= 3.2 && c < 4.2) { hP = mod(c * 3, 1) < 0.5 ? PUNCH : fightP(lt); hF = mod(c * 1.5, 1) < 0.5 ? 1 : -1; }
  else if (c >= 4.2 && c < 5.2) hP = lerpP(STAND, BOW, sin(PI * (c - 4.2)));
  const villain = (side, hitAt, upAt) => {
    let x = side * 0.22, P = fightP(lt + side);
    if (c < 1) { x = side * (0.42 - 0.2 * c); P = walkP(lt * 6, false); }
    else if (c >= hitAt && c < upAt) {
      const k = clamp01((c - hitAt) / 0.5);
      x = side * (0.22 + 0.25 * (1 - (1 - k) * (1 - k)));
      P = lerpP(HIT, LIE, smooth(k));
    } else if (c >= upAt && c < upAt + 0.8) { x = side * 0.47; P = lerpP(LIE, STAND, smooth((c - upAt) / 0.8)); }
    else if (c >= upAt + 0.8) { x = side * 0.42; P = STAND; }
    figure(cx + x * U, G, S, P, -side, 0xFFD8D8D8, { shirt: 0xFF303030 });
  };
  villain(1, 1.4, 6.0);
  villain(-1, 2.65, 7.0);
  figure(cx + hX * U, G, S, hP, hF, FG, { shirt: 0xFFE8E8E8 });
  if (c > 1.05 && c < 1.8) bubble(cx + hX * U, G - S * 1.15, "Кия!", 0.03 * H, 1);
  if (c > 2.5 && c < 3.1) bubble(cx, G - S * 1.15, "Хья!", 0.03 * H, 1);
}

function evMuayThai(cx, j, lt) {
  const S = S_(), G = GY(), U = H;

function drawRoad() {
  rect(0, 0.64 * H, W, 0.715 * H, 0xFF202024);
  const j0 = Math.floor(camX / 0.5) - 1, j1 = j0 + Math.floor(W / H / 0.5) + 3;

    line(x, 0.678 * H, x + 0.25 * H, 0.678 * H, 0x66D8D8D8, 0.004 * H);
  }
  const loop = W / H + 4;
  for (let lane = 0; lane < 2; lane++) {
    const v = lane === 0 ? -1.3 : 1.0, yb = lane === 0 ? 0.672 : 0.712, s = lane === 0 ? 0.85 : 1;
    for (let k = 0; k < 2; k++) {
      const id = lane * 2 + k;
      const rel = mod(k * loop / 2 + rnd(id, 22) * 0.8 + t * v - camX, loop) - 2;
      cv.save();
      cv.translate(rel * H, yb * H);
      cv.scale(Math.sign(v) * H * 0.2 * s, H * 0.2 * s);

}

function drawProps() {
  const j0 = Math.floor(camX / 0.9) - 2, j1 = j0 + Math.floor(W / H / 0.9) + 4;

function drawRope() {
  const ax = (sx - camX) * H + sFace * H * SC * 0.43, ay = FY * H + scooterBump() - H * SC * 0.45 * (1 - 0.6 * sRot);

  cv.beginPath(); cv.moveTo(handX, handY); cv.quadraticCurveTo((handX + ax) / 2, Math.max(handY, ay) + sag, ax, ay); cv.stroke();
}

function drawDude() {
  const k = H * CH, a = sin(phase) * 0.45 * amp, L = lift();
  const bend = liftT >= 0 ? sin(PI * clamp01(liftT / 2)) : 0;
  cv.save();
  cv.translate((px - camX) * H, FY * H);
  cv.scale(k, k);
  oval(-0.2, -0.02, 0.22, 0.025, 0x66000000);
  cv.translate(0, bob / CH);
  if (bend > 0) { cv.translate(0, -0.47); cv.rotate(-0.5 * bend); cv.translate(0, 0.47); }

  const bsx = 0, bsy = -0.79, ba = a * 0.7 + bend * 0.8;
  const bhx = bsx + sin(ba) * 0.36, bhy = bsy + cos(ba) * 0.36;
  handX = (px - camX) * H + k * bhx;
  handY = (FY + bob) * H + k * bhy;
  line(bsx, bsy, bhx, bhy, 0xFFD4A600, 0.07);
  circle(bhx, bhy, 0.03, 0xFFA87048);
  cv.save(); cv.translate(bhx, bhy); cv.rotate(-a * 0.5 + sin(t * 2) * 0.03); bag(); cv.restore();

  leg(-a); leg(a);

  rrect(-0.2, -0.84, -0.04, -0.5, 0.045, 0xFF19191D);
  rrect(-0.19, -0.67, -0.07, -0.53, 0.03, 0xFF26262C);
  circle(-0.045, -0.71, 0.022, 0xFFF0F0F0);

  rect(-0.075, -0.5, 0.08, -0.44, 0xFF141418);
  fill(0xFFF2C200);
  cv.beginPath();
  cv.moveTo(-0.08, -0.46); cv.lineTo(0.085, -0.46); cv.lineTo(0.12, -0.79); cv.quadraticCurveTo(0.115, -0.86, 0.05, -0.86);
  cv.lineTo(-0.03, -0.86); cv.quadraticCurveTo(-0.085, -0.86, -0.085, -0.79); cv.closePath(); cv.fill();
  line(-0.075, -0.47, 0.08, -0.47, 0xFFC89E00, 0.02);
  line(0, -0.85, 0.07, -0.6, 0xFF19191D, 0.025);

  rect(0.035, -0.9, 0.08, -0.84, 0xFFA87048);
  circle(0.075, -0.93, 0.072, 0xFFB07850);
  fill(0xFF151012);
  cv.beginPath(); cv.moveTo(0.065, -0.945);
  cv.arc(0.065, -0.945, 0.078, 140 * PI / 180, 345 * PI / 180); cv.closePath(); cv.fill();
  circle(0.055, -0.925, 0.017, 0xFFA06A44);
  circle(0.118, -0.935, 0.008, 0xFF1A1010);
  line(0.12, -0.893, 0.135, -0.895, 0xFF6A3A2A, 0.008);

  if (hasCig) {
    const ex = 0.13 + 0.08 * cigLen;
    line(0.13, -0.893, 0.15, -0.89, 0xFFD89A50, 0.017);
    if (ex > 0.15) line(0.15, -0.89, ex, -0.885, 0xFFF4F4F0, 0.016);
    if (lit) {
      glow(ex, -0.885, 0.03 + 0.04 * emberGlow, 0xFFFF6A1A, (230 * emberGlow) | 0);
      circle(ex, -0.885, 0.01, 0xFF000000 | (255 << 16) | (((60 + 120 * emberGlow) | 0) << 8) | 30);
    } else {
      circle(ex, -0.885, 0.008, 0xFF888888);
    }
  }

  const fsx = 0.04, fsy = -0.79, fa = -a * 0.7;
  const ex0 = fsx + sin(fa) * 0.18, ey0 = fsy + cos(fa) * 0.18;
  let hx0 = fsx + sin(fa) * 0.36, hy0 = fsy + cos(fa) * 0.36;
  let theta = 0, tx = 0.135, ty = -0.87, elT = [0.17, -0.62];
  if (sipT >= 0) {
    const hold = smooth((sipT - 0.35) / 0.4) * (1 - smooth((sipT - 1.1) / 0.2));
    theta = -1.25 * L - 0.55 * hold;
    const nl = 0.135 * 0.85;
    tx = 0.125 - sin(theta) * nl; ty = -0.89 + cos(theta) * nl;
    elT = [0.24, -0.66];
  }
  if (hasBeer && sipT < 0 && L === 0) { hx0 += 0.02; hy0 -= 0.02; }
  const elx = lerp(ex0, elT[0], L), ely = lerp(ey0, elT[1], L);
  const hx = lerp(hx0, tx, L), hy = lerp(hy0, ty, L);
  stroke(0xFFF2C200, 0.07);
  cv.beginPath(); cv.moveTo(fsx, fsy); cv.lineTo(elx, ely); cv.lineTo(hx, hy); cv.stroke();
  if (hasBeer) {
    cv.save(); cv.translate(hx, hy); cv.rotate(theta); cv.scale(0.85, 0.85); chang(beerLevel, !opened); cv.restore();
  }
  circle(hx, hy, 0.03, 0xFFB07850);
  if (lightT > 0.4 && lightT < 1.05) {
    const fl = 1 + sin(t * 40) * 0.15;
    rrect(hx - 0.012, hy - 0.01, hx + 0.02, hy + 0.04, 0.006, 0xFF2A6AE0);
    glow(hx + 0.004, hy - 0.03, 0.07 * fl, 0xFFFFB040, 200);
    oval(hx - 0.006, hy - 0.06 * fl, hx + 0.014, hy - 0.01, 0xFFFFE070);
  }
  cv.restore();
}

function drawParts() {
  for (const q of parts) {
    const k = q.age / q.life, x = (q.x - camX) * H, y = q.y * H;
    if (q.kind === 0) {
      const r = lerp(q.s0, q.s1, Math.sqrt(k)) * H;
      const a = (255 * q.alpha * (1 - k) * Math.min(1, q.age * 6)) | 0;
      circle(x, y, r, withA(q.col, a));
    } else if (q.kind === 1) {
      line(x - 0.008 * H, y, x + 0.008 * H, y, 0xFFF0F0F0, 0.006 * H);
      if (k < 0.6) glow(x + 0.008 * H, y, 0.012 * H, 0xFFFF5A1A, (220 * (1 - k / 0.6)) | 0);
    } else {
      line(x, y, x - q.vx * 0.04 * H, y - q.vy * 0.04 * H, withA(0xFFFFC040, 255 * (1 - k)), 0.004 * H);
    }
  }
}

function drawDudeBubble() {
  const x = (px - camX) * H + 0.03 * H, y = (FY + elevD - CH * 1.02) * H;
  if (everHeld && !isHolding() && drive < 0.8) {
    bubble(x, y, NAGS[Math.floor(t / 3.5) % NAGS.length], 0.032 * H, clamp01((0.8 - drive) * 3));
  } else if (t < bubbleUntil) {
    bubble(x, y, bubbleText, 0.032 * H, clamp01((bubbleUntil - t) * 3));
  }
}

function drawHud() {
  const hs = Math.min(SW, SH), sh = [0xFF000000, 0.008 * hs, 0.003 * hs];
  const m = 23 * 60 + 47 + ((t / 6) | 0);
  const clock = String(((m / 60) | 0) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  text("Бангкок · Сукхумвит · " + clock, 0.04 * hs, 0.07 * hs, 0.042 * hs, 0xFFFFFFFF, "left", sh);
  text("Пройдено: " + (meters | 0) + " м", 0.04 * hs, 0.115 * hs, 0.034 * hs, 0xFFDDDDDD, "left", sh);
  text("Скурено: " + cigs + " · Выпито чанги: " + beers, 0.04 * hs, 0.155 * hs, 0.034 * hs, 0xFFDDDDDD, "left", sh);
  const st = drunk < 0.5 ? "трезвый" : drunk < 1.5 ? "навеселе" : drunk < 2.5 ? "хорошо так" : "в говно";
  text("Состояние: " + st, 0.04 * hs, 0.195 * hs, 0.034 * hs, drunk < 1.5 ? 0xFFDDDDDD : 0xFFFFC070, "left", sh);

  const mb = muteBtn();
  circle(mb.x, mb.y, mb.r, 0x77000000);
  text(muted ? "🔇" : "🔊", mb.x, mb.y + mb.r * 0.38, mb.r * 1.05, 0xFFFFFFFF);

  if (!everHeld) {
    const a = 180 + 75 * sin(t * 3);
    text("зажми экран — и пошёл", SW / 2, OY + H * 0.3, 0.05 * hs, withA(0xFFFFFF, a), "center", [0xFF000000, 0.01 * hs, 0.004 * hs]);
  }
  if (DEBUG) text("audio: " + (actx ? actx.state : "none") + " step " + step + " session " + (navigator.audioSession ? navigator.audioSession.type : "n/a") + " drive " + drive.toFixed(2), SW / 2, SH - 0.02 * SH, 0.03 * hs, 0xFFFFFF00);
}

// ---------------------------------------------------------------- music

const BPM = 86, STEP = 60 / BPM / 4;
const CHORDS = [[57, 60, 64], [57, 60, 65], [55, 60, 64], [55, 59, 62]];
const ROOTS = [45, 41, 48, 43];
const ARP = [0, 1, 2, 3, 2, 1, 0, 1, 0, 1, 2, 3, 2, 1, 2, 1];
const MELODY = [[0, 76, 6], [6, 74, 2], [8, 72, 4], [12, 71, 4], [16, 69, 8], [24, 72, 4], [28, 74, 4],
  [32, 76, 6], [38, 79, 2], [40, 76, 8], [48, 74, 6], [54, 71, 2], [56, 74, 8]];
let actx = null, master, duck, revIn, dlyIn, noiseBuf, toneF, nextT = 0, step = 0;
let tempo = 1, pitchMul = 1;
let muted = localStorage.getItem("bkMuted") === "1";
const hz = m => 440 * Math.pow(2, (m - 69) / 12) * pitchMul;

let unlocked = false, silentEl = null;

function silentWav() {
  const n = 800, b = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) b.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); b.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true); b.setUint16(20, 1, true);
  b.setUint16(22, 1, true); b.setUint32(24, 8000, true); b.setUint32(28, 16000, true); b.setUint16(32, 2, true);
  b.setUint16(34, 16, true); w(36, "data"); b.setUint32(40, n * 2, true);
  let bin = ""; const u = new Uint8Array(b.buffer);
  for (let i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]);
  return "data:audio/wav;base64," + btoa(bin);
}

function unlockAudio() {
  initAudio();
  if (!actx) return;
  if (actx.state !== "running") actx.resume().catch(() => {});
  if (!unlocked) {
    const src = actx.createBufferSource();
    src.buffer = actx.createBuffer(1, 1, 22050);
    src.connect(actx.destination);
    src.start(0);
    if (!navigator.audioSession) {
      silentEl = document.createElement("audio");
      silentEl.setAttribute("x-webkit-airplay", "deny");
      silentEl.loop = true;
      silentEl.src = silentWav();
      silentEl.play().catch(() => {});
    }
    unlocked = actx.state === "running" || !!navigator.audioSession;
  }
}

for (const ev of ["touchstart", "touchend", "pointerup", "click", "keydown"]) {
  window.addEventListener(ev, unlockAudio, { capture: true, passive: true });
}

function initAudio() {
  if (actx) { if (actx.state !== "running") actx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (navigator.audioSession) { try { navigator.audioSession.type = "playback"; } catch (_) {} }
  actx = new AC();
  actx.onstatechange = () => { if (actx.state === "interrupted" && !document.hidden) actx.resume().catch(() => {}); };
  const c = actx;
  master = c.createGain();
  master.gain.value = muted ? 0 : 0.55;
  toneF = c.createBiquadFilter(); toneF.type = "lowpass"; toneF.frequency.value = 9000;
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  master.connect(toneF); toneF.connect(comp); comp.connect(c.destination);

  const rev = c.createConvolver();
  const len = c.sampleRate * 3.2, ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  rev.buffer = ir;
  revIn = c.createGain(); revIn.connect(rev);
  const revOut = c.createGain(); revOut.gain.value = 0.55; rev.connect(revOut); revOut.connect(master);

  const dly = c.createDelay(2); dly.delayTime.value = STEP * 3;
  const fb = c.createGain(); fb.gain.value = 0.4;
  const dlp = c.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 2400;
  dly.connect(dlp); dlp.connect(fb); fb.connect(dly);
  dlyIn = c.createGain(); dlyIn.connect(dly);
  const dOut = c.createGain(); dOut.gain.value = 0.5; dlp.connect(dOut); dOut.connect(master); dOut.connect(revIn);

  duck = c.createGain(); duck.connect(master);
  noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  nextT = c.currentTime + 0.1;
  setInterval(schedule, 25);
}

function updateMusic(holding) {
  tempo = holding ? 1 : 0.42 + 0.58 * drive;
  pitchMul = holding ? 1 : 0.7 + 0.3 * drive;
  if (toneF) toneF.frequency.setTargetAtTime(holding ? 9000 : 700 + 8300 * drive * drive, actx.currentTime, holding ? 0.02 : 0.15);
}

function route(node, dry, rv, dl, toDuck) {
  const g = actx.createGain(); g.gain.value = dry; node.connect(g); g.connect(toDuck ? duck : master);
  if (rv) { const r = actx.createGain(); r.gain.value = rv; node.connect(r); r.connect(revIn); }
  if (dl) { const d = actx.createGain(); d.gain.value = dl; node.connect(d); d.connect(dlyIn); }
}

function osc(type, freq, t0, stop, detune) {
  const o = actx.createOscillator(); o.type = type; o.frequency.value = freq;
  if (detune) o.detune.value = detune;
  o.start(t0); o.stop(stop);
  return o;
}

function noise(t0, dur) {
  const n = actx.createBufferSource(); n.buffer = noiseBuf;
  n.start(t0, Math.random() * 0.5); n.stop(t0 + dur);
  return n;
}

function pad(chord, t0, dur) {
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 2;
  f.frequency.setValueAtTime(500, t0); f.frequency.linearRampToValueAtTime(1700, t0 + dur * 0.6); f.frequency.linearRampToValueAtTime(900, t0 + dur);
  const env = actx.createGain();
  env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(0.045, t0 + 0.5);
  env.gain.setValueAtTime(0.045, t0 + dur - 0.1); env.gain.linearRampToValueAtTime(0, t0 + dur + 0.9);
  for (const m of chord) for (const dt of [-9, 9]) osc("sawtooth", hz(m), t0, t0 + dur + 1, dt).connect(f);
  osc("triangle", hz(chord[0] - 12), t0, t0 + dur + 1).connect(f);
  f.connect(env);
  route(env, 1, 0.6, 0, true);
}

function bass(m, t0, st) {
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 4;
  f.frequency.setValueAtTime(1100, t0); f.frequency.exponentialRampToValueAtTime(260, t0 + 0.2);
  const env = actx.createGain();
  env.gain.setValueAtTime(0.0001, t0); env.gain.exponentialRampToValueAtTime(0.22, t0 + 0.008);
  env.gain.exponentialRampToValueAtTime(0.08, t0 + st * 1.8); env.gain.linearRampToValueAtTime(0, t0 + st * 1.95);
  osc("sawtooth", hz(m), t0, t0 + st * 2).connect(f);
  osc("square", hz(m - 12), t0, t0 + st * 2).connect(f);
  f.connect(env);
  route(env, 1, 0, 0, true);
}

function arp(m, t0, vol) {
  const f = actx.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(3500, t0); f.frequency.exponentialRampToValueAtTime(700, t0 + 0.16);
  const env = actx.createGain();
  env.gain.setValueAtTime(0.0001, t0); env.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
  env.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  osc("square", hz(m), t0, t0 + 0.25).connect(f);
  f.connect(env);
  route(env, 1, 0.3, 0.55, false);
}

function lead(m, t0, dur) {
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 2300;
  const env = actx.createGain();
  env.gain.setValueAtTime(0, t0); env.gain.linearRampToValueAtTime(0.08, t0 + 0.06);
  env.gain.setValueAtTime(0.08, t0 + dur - 0.05); env.gain.linearRampToValueAtTime(0, t0 + dur + 0.25);
  const lfo = osc("sine", 5.5, t0, t0 + dur + 0.3);
  const depth = actx.createGain();
  depth.gain.setValueAtTime(0, t0); depth.gain.linearRampToValueAtTime(12, t0 + Math.min(dur, 0.5));
  lfo.connect(depth);
  for (const dt of [-7, 7]) {
    const o = osc("sawtooth", hz(m), t0, t0 + dur + 0.3, dt);
    depth.connect(o.detune);
    o.connect(f);
  }
  f.connect(env);
  route(env, 1, 0.7, 0.45, false);
}

function kick(t0) {
  const o = osc("sine", 150 * pitchMul, t0, t0 + 0.4);
  o.frequency.exponentialRampToValueAtTime(42 * pitchMul, t0 + 0.12);
  const env = actx.createGain();
  env.gain.setValueAtTime(0.95, t0); env.gain.exponentialRampToValueAtTime(0.001, t0 + 0.38);
  o.connect(env);
  route(env, 1, 0, 0, false);
  duck.gain.cancelScheduledValues(t0);
  duck.gain.setValueAtTime(0.25, t0); duck.gain.linearRampToValueAtTime(1, t0 + 0.32);
}

function snare(t0) {
  const n = noise(t0, 0.3);
  const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1700 * pitchMul; bp.Q.value = 0.6;
  const env = actx.createGain();
  env.gain.setValueAtTime(0.45, t0); env.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
  n.connect(bp); bp.connect(env);
  route(env, 1, 1.4, 0, false);
  const o = osc("triangle", 190 * pitchMul, t0, t0 + 0.12);
  const e2 = actx.createGain();
  e2.gain.setValueAtTime(0.3, t0); e2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
  o.connect(e2);
  route(e2, 1, 0.6, 0, false);
}

function hat(t0, open) {
  const n = noise(t0, open ? 0.3 : 0.06);
  const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7500 * pitchMul;
  const env = actx.createGain();
  env.gain.setValueAtTime(open ? 0.05 : 0.035, t0); env.gain.exponentialRampToValueAtTime(0.001, t0 + (open ? 0.25 : 0.04));
  n.connect(hp); hp.connect(env);
  route(env, 1, 0.1, 0, false);
}

function playStep(s, t0, st) {
  const bar = Math.floor(s / 16), sp = s % 16, ch = bar % 4, loop = Math.floor(bar / 4);
  const intro = bar < 4, breakdown = loop % 6 === 5;
  if (sp === 0) pad(CHORDS[ch], t0, st * 16);
  const tones = CHORDS[ch].concat([CHORDS[ch][0] + 12]);
  arp(tones[ARP[sp]] + 12, t0, intro ? 0.035 : 0.045);
  if (intro || breakdown) return;
  if (sp % 2 === 0) bass(ROOTS[ch] + (sp === 14 && ch === 3 ? 2 : 0), t0, st);
  if (sp === 0 || sp === 8 || (sp === 10 && loop % 2 === 1)) kick(t0);
  if (sp === 4 || sp === 12) snare(t0);
  hat(t0, sp === 6 || sp === 14);
  if (loop % 4 >= 2) {
    const pos = (bar % 4) * 16 + sp;
    for (const n of MELODY) if (n[0] === pos) lead(n[1], t0, n[2] * st);
  }
}

function schedule() {
  if (!actx || actx.state !== "running") return;
  if (nextT < actx.currentTime) nextT = actx.currentTime + 0.05;
  const st = STEP / tempo;
  while (nextT < actx.currentTime + 0.15) {
    playStep(step, nextT, st);
    nextT += st;
    step++;
  }
}

function sfxNoise(t0, dur, type, freq, peak, attack) {
  const n = noise(t0, dur);
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const e = actx.createGain();
  e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(peak, t0 + attack); e.gain.linearRampToValueAtTime(0, t0 + dur);
  n.connect(f); f.connect(e); e.connect(master);
  return f;
}

function sfxTone(type, f0, f1, t0, dur, peak) {
  const o = osc(type, f0, t0, t0 + dur);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.9);
  const e = actx.createGain();
  e.gain.setValueAtTime(0.0001, t0); e.gain.exponentialRampToValueAtTime(peak, t0 + 0.01); e.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(e); e.connect(master);
  return o;
}

const sfxOn = () => actx && !muted;

function sfxLighter() {
  if (!sfxOn()) return;
  const t0 = actx.currentTime;
  sfxNoise(t0, 0.04, "highpass", 3000, 0.25, 0.002);
  sfxNoise(t0 + 0.09, 0.04, "highpass", 3000, 0.25, 0.002);
  sfxNoise(t0 + 0.1, 0.6, "bandpass", 500, 0.12, 0.1);
}

function sfxExhale(big) {
  if (!sfxOn()) return;
  const t0 = actx.currentTime, dur = big ? 1.4 : 1.0;
  sfxNoise(t0, dur, "lowpass", 1400, big ? 0.22 : 0.15, 0.12).frequency.linearRampToValueAtTime(500, t0 + dur);
}

function sfxOpen() {
  if (!sfxOn()) return;
  const t0 = actx.currentTime;
  sfxTone("sine", 900, 250, t0, 0.08, 0.25);
  sfxNoise(t0 + 0.02, 0.45, "highpass", 2500, 0.18, 0.01).frequency.linearRampToValueAtTime(5000, t0 + 0.4);
}

function sfxGlug() { if (sfxOn()) sfxTone("sine", 230, 110, actx.currentTime, 0.13, 0.3); }

function sfxBurp() {
  if (!sfxOn()) return;
  const t0 = actx.currentTime, dur = 0.55;
  const o = osc("sawtooth", 85, t0, t0 + dur);
  o.frequency.linearRampToValueAtTime(65, t0 + dur);
  const am = osc("sine", 28, t0, t0 + dur), amg = actx.createGain(); amg.gain.value = 0.5;
  const f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 450; f.Q.value = 2;
  const e = actx.createGain();
  e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(0.5, t0 + 0.05); e.gain.linearRampToValueAtTime(0, t0 + dur);
  am.connect(amg); amg.connect(e.gain);
  o.connect(f); f.connect(e); e.connect(master);
}

function sfxHonk() {
  if (!sfxOn()) return;
  const t0 = actx.currentTime;
  for (const d of [0, 0.4]) { sfxTone("square", 392, 0, t0 + d, 0.3, 0.12); sfxTone("square", 494, 0, t0 + d, 0.3, 0.1); }
}

function sfxClunk() {
  if (!sfxOn()) return;
  const t0 = actx.currentTime;
  sfxTone("sine", 140, 45, t0, 0.3, 0.6);
  sfxNoise(t0, 0.25, "lowpass", 900, 0.4, 0.005);
  sfxNoise(t0 + 0.05, 0.2, "bandpass", 3000, 0.15, 0.005);
}

function sfxScrape() { if (sfxOn()) sfxNoise(actx.currentTime, 0.2, "bandpass", 2200 + Math.random() * 1500, 0.07, 0.03); }

function toggleMute() {
  muted = !muted;
  localStorage.setItem("bkMuted", muted ? "1" : "0");
  initAudio();
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, actx.currentTime, 0.1);
}

document.addEventListener("visibilitychange", () => {
  if (!actx) return;
  if (document.hidden) { actx.suspend(); if (silentEl) silentEl.pause(); }
  else { actx.resume().catch(() => {}); if (silentEl) silentEl.play().catch(() => {}); }
});

requestAnimationFrame(frame);
</script>
</body>
</html>
