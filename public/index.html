const SEED = (() => { const m = /[?&]seed=(\d+)/.exec(location.search); if (m) return +m[1];

function rnd(i, salt) {

}

}

const BUBBLE_K = 1.4;
function bubble(x, y, s, size, alpha) {

  size = Math.max(size * BUBBLE_K, 14);
  const ss = Math.max(size * 0.75, 11);
  font(size);
  let w = cv.measureText(s).width + size * 1.2, h = size * 1.7;

}

// ---------------------------------------------------------------- world layout

function crossX(c) { return c * CROSS + 7 + rnd(c, 172) * 3; }
function isRed(c) { return mod(t + rnd(c, 170) * 12, 12) < 7; }
function lightLeft(c) { const p = mod(t + rnd(c, 170) * 12, 12); return p < 7 ? 7 - p : 12 - p; }
function nearCross(x, pad) { const c = Math.round((x - 8.5) / CROSS); return Math.abs(x - crossX(c)) < pad; }
function stepX(s) { return s * STEPGAP + 12 + rnd(s, 173) * 5; }
function validStep(s) { return !nearCross(stepX(s), 1.5) && !nearCross(stepX(s) + 0.5, 1.5); }
function onStep(x) {
  const s = Math.floor((x - 12) / STEPGAP);
  for (const k of [s - 1, s, s + 1]) { const xs = stepX(k); if (validStep(k) && x >= xs && x <= xs + 0.5) return true; }
  return false;
}

function lerpRGB(a, b, k) {
  const r = lerp((a >> 16) & 255, (b >> 16) & 255, k), g = lerp((a >> 8) & 255, (b >> 8) & 255, k), bb = lerp(a & 255, b & 255, k);
  return ((r | 0) << 16) | ((g | 0) << 8) | (bb | 0);
}
const hex = c => "#" + (c & 0xFFFFFF).toString(16).padStart(6, "0");

function updateTod() {
  const m = gameMin();
  let i = 0;
  while (i < TOD_KEYS.length - 2 && m >= TOD_KEYS[i + 1][0]) i++;
  const [m0, a] = TOD_KEYS[i], [m1, b] = TOD_KEYS[i + 1], k = smooth((m - m0) / Math.max(1, m1 - m0));
  const A = TOD_STATES[a], B = TOD_STATES[b];
  TOD = {
    sky: A.sky.map((c, j) => lerpRGB(c, B.sky[j], k)),
    ov: A.ov.map((v, j) => lerp(v, B.ov[j], k)), ov2: A.ov2.map((v, j) => lerp(v, B.ov2[j], k)),
    glow: lerp(A.glow, B.glow, k), day: lerp(A.day, B.day, k),
  };
  const dayN = Math.floor((START_MIN + t / 2 + clockOff) / 1440);
  if (m > 345 && m < 400 && morningSaid !== dayN && everHeld) { morningSaid = dayN; sayOne("morning", 3); }
}

function drawCelestial() {
  const m = gameMin();
  const sunK = (m - 345) / (1140 - 345);
  if (sunK > -0.05 && sunK < 1.05) {
    const sxp = W * lerp(0.08, 0.92, sunK), syp = OY * 0.3 + H * (0.5 - 0.42 * sin(clamp01(sunK) * PI));
    glow(sxp, syp, H * 0.22, 0xFFFFE8A0, 120 / Math.max(0.25, TOD.glow));
    circle(sxp, syp, H * 0.04, lerpRGB(0xFF8A40, 0xFFF8D8, sin(clamp01(sunK) * PI)) | 0xFF000000);
  }
  const moonA = 1 - clamp01(TOD.day * 2);
  if (moonA > 0) {
    cv.globalAlpha = moonA;
    glow(W * 0.8, H * 0.08, H * 0.1, 0xFFFFE6C8, 45);
    circle(W * 0.8, H * 0.08, H * 0.025, 0xFFE8DCC8);
    cv.globalAlpha = 1;
  }
}

function todOverlay() {
  for (const [op, c] of [["screen", TOD.ov], ["overlay", TOD.ov2]]) {
    if (c[3] <= 0.01) continue;
    cv.globalCompositeOperation = op;
    cv.fillStyle = "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + c[3].toFixed(3) + ")";
    cv.fillRect(0, 0, SW, SH);
  }
  cv.globalCompositeOperation = "source-over";
}

function walkP(ph, run) {
  const s = sin(ph), m = run ? 1.8 : 1;
  return [run ? 0.3 : 0.05, 0.4 * s * m, 0.15 + 0.4 * m * Math.max(0, sin(ph + 1.6)), -0.4 * s * m, 0.15 + 0.4 * m * Math.max(0, sin(ph + 1.6 + PI)),
    -0.4 * s * m, run ? 1.4 : 0.3, 0.4 * s * m, run ? 1.4 : 0.3, -Math.abs(cos(ph)) * 0.02, 0, 0];
}
function fightP(ph) { return [0.12, -0.35, 0.45, 0.3, 0.35, 0.7, 1.9, 1.1, 1.5, 0.05 + 0.015 * sin(ph * 7), 0, 0]; }
function danceP(ph, style) {
  const s = sin(ph), c = cos(ph);
  if (style === 0) return [0.1 * s, 0.15 * s, 0.2, -0.15 * s, 0.2, 2.7 + 0.35 * s, 0.3, 2.7 - 0.35 * s, 0.3, 0.03 * (1 + sin(ph * 2)), 0, 0.15 * s];
  if (style === 1) {
    const up = sin(ph * 0.5) > 0;
    return [0.05, 0.25 * s, 0.2, -0.1, 0.1, up ? 2.6 : 0.5, 0.1, up ? 0.3 : 2.6, 0.1, 0.02, 0, 0.1 * c];
  }
  if (style === 2) return [0.2 * s, 0.5, 0.9 + 0.3 * s, -0.2, 0.9 - 0.3 * s, 1.2 + 0.6 * s, 1.5, 1.2 - 0.6 * s, 1.5, 0.12 + 0.05 * s, 0, 0];
  return [0.1 * c, 0.3 * s, 0.4, -0.3 * s, 0.4, 1.6 + 0.8 * c, 0.4, 1.6 - 0.8 * c, 0.4, 0.04 * Math.abs(s), 0, 0.2 * c];
}
function cheerP(ph) { return [0, -0.05, 0.1, 0.05, 0.1, 2.8 + 0.2 * sin(ph * 2), 0.2, 2.8 - 0.2 * sin(ph * 2), 0.2, -0.04 * Math.abs(sin(ph * 2)), 0, -0.2]; }
function waveP(ph) { return [0, -0.05, 0.05, 0.05, 0.05, 0.2, 0.3, 2.6, 0.4 + 0.5 * sin(ph * 8), 0, 0, 0]; }
function singP(ph) { return [0.1 * sin(ph), -0.1, 0.1, 0.1, 0.1, 1.6 + 0.5 * sin(ph * 1.3), 0.3, 1.0, 2.3, 0, 0, -0.15]; }
function batonP(ph) { return [0.3, -0.4, 0.3, 0.3, 0.3, 0.3, 0.5, 1.9 + 1.0 * cos(ph), 0.3, 0.04, 0, 0.2]; }

function figure(x, y, s, P, f, col, ex) {
  ex = ex || {};
  [s, P, col, ex] = varyFigure(s, P, col, ex);
  cv.save();
  cv.translate(x, y);
  cv.scale(f * s, s);
  if (P[10]) cv.rotate(-P[10]);
  const lw = 0.065;
  const hx = 0, hy = -0.5 + P[9];
  stroke(col, lw);
  for (const [tt, kk] of [[P[1], P[2]], [P[3], P[4]]]) {
    const kx = hx + sin(tt) * 0.26, ky = hy + cos(tt) * 0.26;
    const fx = kx + sin(tt - kk) * 0.26, fy = ky + cos(tt - kk) * 0.26;
    cv.beginPath(); cv.moveTo(hx, hy); cv.lineTo(kx, ky); cv.lineTo(fx, fy); cv.stroke();
  }
  const nx = hx + sin(P[0]) * 0.3, ny = hy - cos(P[0]) * 0.3;
  if (ex.bag) rrect(nx - 0.13 * cos(P[0]) - 0.04, ny + 0.02, nx - 0.02, ny + 0.2, 0.03, ex.bag);
  if (ex.robe) {
    stroke(ex.robe, 0.16);
    cv.beginPath(); cv.moveTo(hx, hy + 0.12); cv.lineTo(nx, ny + 0.03); cv.stroke();
  } else if (ex.shirt) {
    stroke(ex.shirt, 0.12);
    cv.beginPath(); cv.moveTo(hx, hy); cv.lineTo(nx, ny + 0.04); cv.stroke();
  } else {
    stroke(col, lw);
    cv.beginPath(); cv.moveTo(hx, hy); cv.lineTo(nx, ny); cv.stroke();
  }
  if (ex.skirt) poly([hx - 0.05, hy - 0.04, hx + 0.05, hy - 0.04, hx + 0.12, hy + 0.13, hx - 0.12, hy + 0.13], ex.skirt);
  figureBody(hx, hy, nx, ny, P, col, ex);
  const hands = [];
  for (const [a, e] of [[P[5], P[6]], [P[7], P[8]]]) {
    const ex1 = nx + sin(a) * 0.17, ey1 = ny + cos(a) * 0.17;
    const hx2 = ex1 + sin(a + e) * 0.17, hy2 = ey1 + cos(a + e) * 0.17;
    stroke(ex.shirt && !ex.robe ? ex.shirt : col, lw);
    cv.beginPath(); cv.moveTo(nx, ny); cv.lineTo(ex1, ey1); cv.lineTo(hx2, hy2); cv.stroke();
    hands.push([hx2, hy2, a + e]);
  }
  const ht = P[11] - 0.75 * LOOKUP;
  const hcX = nx + sin(P[0] + ht) * 0.1, hcY = ny - cos(P[0] + ht) * 0.1;
  circle(hcX, hcY, 0.075, col);
  if (ex.hat === "cop") { rect(hcX - 0.08, hcY - 0.09, hcX + 0.08, hcY - 0.04, 0xFF20304A); rect(hcX - 0.02, hcY - 0.06, hcX + 0.11, hcY - 0.04, 0xFF20304A); }
  if (ex.hat === "sun") oval(hcX - 0.14, hcY - 0.08, hcX + 0.14, hcY - 0.03, 0xFFE8D8A0);
  if (!figureHair(hcX, hcY, ex) && ex.hair) { fill(ex.hair); cv.beginPath(); cv.arc(hcX, hcY, 0.08, PI * 0.9, PI * 2.1); cv.fill(); line(hcX - 0.06, hcY, hcX - 0.09, hcY + 0.14, ex.hair, 0.05); }
  if (ex.hat === "cap") { rect(hcX - 0.08, hcY - 0.085, hcX + 0.07, hcY - 0.035, 0xFF2A3A6A); rect(hcX + 0.03, hcY - 0.05, hcX + 0.14, hcY - 0.035, 0xFF2A3A6A); }
  const [rx, ry, ra] = hands[1];
  if (ex.bottle) {
    cv.save(); cv.translate(rx, ry); cv.rotate(-ra + PI);
    rrect(-0.025, -0.06, 0.025, 0.07, 0.01, 0xE01B6B32); rect(-0.009, -0.12, 0.009, -0.06, 0xE01B6B32);
    cv.restore();
  }
  if (ex.mic) { line(rx, ry, rx + sin(ra) * 0.08, ry + cos(ra) * 0.08, 0xFF333333, 0.03); circle(rx + sin(ra) * 0.1, ry + cos(ra) * 0.1, 0.03, 0xFF888888); }
  if (ex.baton) line(rx, ry, rx + sin(ra) * 0.26, ry + cos(ra) * 0.26, 0xFF111111, 0.035);
  if (ex.selfie) {
    const sx2 = rx + sin(ra) * 0.45, sy2 = ry + cos(ra) * 0.45;
    line(rx, ry, sx2, sy2, 0xFF999999, 0.015);
    rrect(sx2 - 0.04, sy2 - 0.06, sx2 + 0.04, sy2 + 0.06, 0.01, 0xFF222222);
    glow(sx2, sy2, 0.12, 0xFFFFFFFF, 120);
  }
  if (ex.bowl) oval(hands[0][0] - 0.05, hands[0][1] - 0.03, hands[0][0] + 0.05, hands[0][1] + 0.03, 0xFF2A2A2A);
  cv.restore();
}

// ---------------------------------------------------------------- input

const AUTOWALK = /[?&]autowalk/.test(location.search);
const AUTO = () => autoOn || AUTOWALK;
function isHolding() { return !cop && !atmUse && !liftRide && !(seller && seller.st === "buy") && !(offer && (offer.st === "go" || offer.st === "run")) && (AUTOWALK || autoOn || pointers.size > 0 || keysDown.size > 0); }

cvs.addEventListener("pointerdown", e => {
  e.preventDefault();
  const b = btnAt(e.clientX, e.clientY);
  if (b) { pressBtn(b); return; }
  initAudio();
  pointers.add(e.pointerId);
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
});
const up = e => pointers.delete(e.pointerId);
cvs.addEventListener("pointerup", up);
cvs.addEventListener("pointercancel", up);
cvs.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "m" || k === "ь") { if (!e.repeat) toggleMute(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  initAudio();
  keysDown.add(k);
  e.preventDefault();
});
window.addEventListener("keyup", e => keysDown.delete(e.key.toLowerCase()));
window.addEventListener("blur", () => { keysDown.clear(); pointers.clear(); });

// ---------------------------------------------------------------- dude logic

const wx = lx => px + lx * CH;
const wy = ly => FY + bob + ly * CH;
const curve = (x, upDur, downAt, downDur) => smooth(x / upDur) * (1 - smooth((x - downAt) / downDur));

function lift() {
  if (lightT >= 0) return curve(lightT, 0.3, 1.15, 0.3);
  if (sipT >= 0) return curve(sipT, 0.35, 1.3, 0.35);
  if (dragT >= 0 && !hasBeer) return curve(dragT, 0.3, 0.9, 0.3);
  return 0;
}

function addPart(x, y, vx, vy, life, s0, s1, alpha, kind, col) {
  parts.push({ x, y, vx, vy, age: 0, life, s0, s1, alpha, kind, col: col || 0xC8C8D2 });
}

function puff(n) {
  sfxExhale(n > 12);
  const mx = wx(0.13), my = wy(-0.89);
  for (let i = 0; i < n; i++) {
    addPart(mx, my, 0.03 + Math.random() * 0.05, -0.008 - Math.random() * 0.025,
      2 + Math.random() * 1.8, 0.008, 0.05 + Math.random() * 0.04, 0.32, 0);
  }
}

function say(s, dur) { bubbleText = s; bubbleUntil = t + dur; }

function startSmoke() { lightT = 0; nextDragAt = t + 4.5; }
function startBeer(kind) { drinkKind = kind || "chang"; openT = 0; hasBeer = true; opened = false; beerLevel = 1; nextSipAt = t + 1.5; if (drinkKind === "yadong") sayOne("yadong", 2); }

function flick() {
  hasCig = false; lit = false;
  addPart(wx(0.13 + 0.08 * cigLen), wy(-0.885), 0.35, -0.35, 5, 0.004, 0.004, 1, 1);
}

function eventLx(j) { return Math.round((j * SLOT + SLOT / 2 - 0.3) / 0.6) * 0.6 + 0.3; }
function eventX(j) { return (eventLx(j) - camX * FAC) * H; }
function hostsEvent(i) { const j0 = Math.floor(i * 0.6 / SLOT); for (const j of [j0 - 1, j0, j0 + 1]) if (Math.abs(eventLx(j) - (i * 0.6 + 0.3)) < 0.01 && eventFn(j)) return true; return false; }

function crossingBlock(holding) {
  if (dudeHidden || inStruct(px, 0.6)) return false;
  let blocked = false;
  const ci = Math.floor((px - 7) / CROSS);
  for (const c of [ci, ci + 1]) {
    if (crossDone.has(c)) continue;
    const stopX = crossX(c) - 0.5;
    if (px > stopX + 0.01) { crossDone.add(c); continue; }
    if (px < stopX - 0.45) continue;
    if (seesRed(c) && t > jayUntil) {
      blocked = true;
      if (px > stopX) px = stopX;
      if (!crossSaid.has(c)) { crossSaid.add(c); if (isRed(c)) sayOne("red", 2); else sayS1("mixRed", 2.2); redHold = 0; }
      if (holding) redHold += lastDt;
      if (redHold > 3.5) {
        crossDone.add(c); redHold = 0; jayUntil = t + 2.5; blocked = false;
        sfxHonk(); sayOne("run", 2);
      }
    } else if (crossSaid.has(c) && t > jayUntil) {
      crossDone.add(c); redHold = 0; sayOne("green", 1.5);
    } else if (isRed(c) && t > jayUntil && !crossMixSaid.has(c)) {
      crossMixSaid.add(c); sayS1("mixGo", 1.8);
    }
  }
  return blocked;
}

let lastDt = 0.016;
function update(dt) {
  lastDt = dt;
  t += dt;
  const holding = isHolding();
  if (holding) {
    if (!everHeld) { everHeld = true; nextActionAt = t + 10; }
    drive = 1;
  } else {
    drive = Math.max(0, drive - dt / 3.5);
  }
  const blocked = crossingBlock(holding);
  let target = t < stopUntil || blocked ? 0 : drive * drunkGait();
  if (t < jayUntil) target = 1.9 * drive;
  speed += (target - speed) * Math.min(1, dt * (target < speed && (t < stopUntil || blocked) ? 5 : 3));
  if (speed < 0.002) speed = 0;
  const v = SPEED * speed;
  px += v * dt;
  meters += v * dt * 5.7;
  phase += dt * 6.5 * Math.min(1.6, speed * 1.4);
  amp += (Math.min(1, speed * 1.6) - amp) * Math.min(1, dt * 6);
  if (amp < 0.02) phase = lerp(phase, Math.round(phase / PI) * PI, Math.min(1, dt * 4));
  elevD += ((onStep(px) && !inStruct(px) ? -0.02 : 0) - dudeElev() - elevD) * Math.min(1, dt * 12);
  bob = -Math.abs(cos(phase)) * 0.012 * amp + elevD;
  camX = px - dudeFrac * W / H;

  const dx = px - sx, old = sx;
  if (Math.abs(dx) > ROPE) sx = px - Math.sign(dx) * ROPE;
  if (sx !== old) {
    sFace = sx > old ? 1 : -1;
    if (!scooterDown) wheelRot += (sx - old) / (0.09 * SC);
    const s0 = Math.floor((sx - 12) / STEPGAP);
    for (const s of [s0, s0 + 1]) {
      const xs = stepX(s);
      if (validStep(s) && !stepHit.has(s) && old < xs && sx >= xs && !scooterDown && !inStruct(sx, 0.3)) {
        stepHit.add(s); scooterDown = true; downSince = t; falls++;
        sfxClunk(); setTimeout(() => sayOne("vespa", 1.8), 350);
      }
    }
    if (scooterDown && liftT < 0) {
      sparkT -= dt; scrapeT -= dt;
      if (sparkT < 0) {
        sparkT = 0.04;
        addPart(sx - 0.05 + Math.random() * 0.04, FY - 0.005, -(0.05 + Math.random() * 0.2), -0.15 - Math.random() * 0.25, 0.35, 0, 0, 1, 3);
      }
      if (scrapeT < 0) { scrapeT = 0.22; sfxScrape(); }
    }
  }
  if (AUTO() && scooterDown && liftT < 0 && t - downSince > 2.2 && t > stopUntil) stopUntil = t + 3;
  if (scooterDown && liftT < 0 && (!holding || AUTO()) && speed < 0.05 && t - downSince > 0.8) {
    liftT = 0; say(fresh(LIFTS), 3.4);
  }
  if (liftT >= 0) {
    if (holding && !AUTO() && liftT < 1.5) liftT = -1;
    else {
      liftT += dt * (holding ? 3 : 1);
      if (liftT >= 2.5 && scooterDown) scooterDown = false;
      if (liftT > 3.6) liftT = -1;
    }
  }
  const lp = liftPose();
  liftDXs += ((lp ? lp.dx : 0) - liftDXs) * Math.min(1, dt * 10);
  const sTarget = scooterDown ? (liftT >= 1.5 ? 1 - smooth((liftT - 1.5) / 1.0) : 1) : 0;
  sRot += (sTarget - sRot) * Math.min(1, dt * 9);

  if (holding && t > stopUntil && !blocked) {
    const dX = (px - camX) * H;
    const j0 = Math.floor((camX * FAC) / SLOT) - 1;
    for (let j = j0; j < j0 + 6; j++) {
      if (watched.has(j) || !eventFn(j)) continue;
      const rel = eventX(j) - dX;
      if (rel > 0.05 * H && rel < 0.3 * H) {
        watched.add(j);
        const sp = COMMENTS.get(eventFn(j));
        if (sp) say(fresh(sp), 2.4);
        else if (Math.random() < 0.5) say(fresh(WOWS), 2.2);
        break;
      }
    }
  }
  if (holding && t > nextActionAt && t > stopUntil) {
    if (yaPending && !hasBeer) { if (canPay(50)) { yaPending = false; spend(50, T("я-донг", "ya dong")); startBeer("yadong"); } }
    else if (ADULT && !hasCig && lightT < 0 && (hasBeer || Math.random() < 0.55)) { if (cigs % 20 === 0 ? canPay(140) : true) { if (cigs % 20 === 0) spend(140, T("сиги", "smokes")); startSmoke(); } }
    else if (!hasBeer && canPay(70) && (ADULT || Math.random() < 0.3)) { spend(70, ADULT || nextIsBeer ? T("Чанг", "Chang") : "Pocari"); startBeer(); }
    nextActionAt = t + 25 + Math.random() * 20;
  }

  if (lightT >= 0) {
    if (lightT < 0.4 && lightT + dt >= 0.4) sfxLighter();
    lightT += dt;
    if (lightT >= 0.3 && !hasCig) { hasCig = true; cigLen = 1; cigs++; }
    if (lightT >= 1.0 && !lit) { lit = true; emberGlow = 1; }
    if (lightT > 1.5) { lightT = -1; puff(10); }
  }
  if (lit && dragT < 0 && sipT < 0 && t > nextDragAt) { dragT = 0; nextDragAt = t + 3.5 + Math.random() * 3; }
  if (dragT >= 0) {
    const prev = dragT;
    dragT += dt;
    if (dragT > 0.35 && dragT < 0.95) { emberGlow = 1; cigLen -= dt * 0.15; }
    if (prev < 1.2 && dragT >= 1.2) puff(16);
    if (dragT > 1.7) dragT = -1;
  }
  if (lit) {
    cigLen -= dt * 0.02;
    if (cigLen < 0.22 && dragT < 0) flick();
  }
  emberGlow += (0.35 - emberGlow) * Math.min(1, dt * 2);
  if (lit) {
    idleSmoke -= dt;
    if (idleSmoke < 0) {
      idleSmoke = 0.1;
      addPart(wx(0.13 + 0.08 * cigLen), wy(-0.885), (Math.random() - 0.5) * 0.01, -0.035, 2.6, 0.003, 0.02, 0.2, 0);
    }
  }

  if (openT >= 0) {
    const prev = openT;
    openT += dt;
    if (prev < 0.7 && openT >= 0.7) {
      opened = true;
      sfxOpen();
      for (let i = 0; i < 8; i++) addPart(wx(0.08), wy(-0.58), (Math.random() - 0.5) * 0.04, -0.03 - Math.random() * 0.03, 0.6, 0.004, 0.01, 0.8, 0, 0xFFFFF4D8);
    }
    if (openT > 1.3) openT = -1;
  }
  if (hasBeer && opened && sipT < 0 && dragT < 0 && openT < 0 && t > nextSipAt) { sipT = 0; nextSipAt = t + 4 + Math.random() * 4; }
  if (sipT >= 0) {
    const prev = sipT;
    sipT += dt;
    for (const g of [0.55, 0.85, 1.15]) if (prev < g && sipT >= g) sfxGlug();
    if (sipT > 0.35 && sipT < 1.3) { beerLevel -= dt * (drinkKind === "yadong" ? 0.55 : 0.2); drunk += dt * 0.16; }
    if (sipT > 1.7) {
      sipT = -1;
      if (beerLevel <= 0.05) {
        hasBeer = false; opened = false;
        bottles.push({ x: px + 0.05, k: drinkKind });
        if (drinkKind === "chang") {
          beers++;
          if (beers % 3 === 0) { yaPending = true; nextActionAt = Math.min(nextActionAt, t + 4); }
        } else {
          yadongs++; trip = 1; blurAmt = 1;
          setTimeout(() => sayOne("spin", 2.5), 2500);
        }
        if (bottles.length > 40) bottles.shift();
        if (Math.random() < 0.6) setTimeout(() => { sfxBurp(); sayOne("burp", 1.5); }, 500);
      }
    }
  }
  drunk = Math.max(0, drunk - dt * 0.012);
  blurAmt = Math.max(0, blurAmt - dt / 8);
  if (trip > 0) {
    trip = Math.max(0, trip - dt / 40);
    if (trip > 0.2 && t > bubbleUntil + 6 && Math.random() < dt / 8) say(fresh(TRIPS), 2.5);
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.age += dt;
    if (q.age > q.life) { parts.splice(i, 1); continue; }
    if (q.kind === 0) {
      q.vx = q.vx * (1 - dt * 0.8) - 0.006 * dt;
      q.vy *= (1 - dt * 0.2);
      q.x += q.vx * dt + sin(t * 2 + q.life * 10) * 0.004 * dt;
      q.y += q.vy * dt;
    } else {
      q.vy += 1.3 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.kind === 1 && q.y > FY + 0.01) { q.y = FY + 0.01; q.vy *= -0.3; q.vx *= 0.5; }
    }
  }

  updateSeller(dt, holding);
  updateStage1(dt, holding);
  updateOffer(dt, holding);
  updateStructs();
  updateMono(holding);
  updateQuiet(dt);
  updateAch();
  updateTod();
  updateJet();
  updateMusic(holding);
}

// ---------------------------------------------------------------- frame

function frame(ts) {
  const dt = last === 0 ? 0.016 : Math.min(0.05, (ts - last) / 1000);
  last = ts;
  update(dt);

  cv.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky();
  cv.save();
  cv.translate(jetShake * sin(t * 60) * 0.006 * H, OY + jetShake * cos(t * 53) * 0.006 * H);
  const dz = Math.min(drunk, 3);
  if (dz > 0.05) {
    cv.translate(W / 2, H * 0.9);
    cv.rotate(sin(t * 0.55) * 0.024 * dz + sin(t * 1.7) * 0.006 * dz * dz);
    cv.translate(-W / 2 + sin(t * 0.8) * 0.016 * H * dz, -H * 0.9);
  }
  drawSkyline();
  drawFacades();
  drawEvents();
  drawLoveWindow();
  drawRoad();
  drawBikes();
  drawStage1Road();
  drawWalk();
  drawCrossings();
  drawSteps();
  drawPoles();
  drawProps();
  drawAtms();
  drawOffer();
  drawStructs();
  drawBottles();
  drawSeller();
  drawCops();
  drawScooter();
  drawDude();
  drawRope();
  drawStructsFront();
  drawParts();
  if (trip > 0.3) pinkElephant(W * 0.55 + sin(t * 0.35) * W * 0.25, -OY * 0.5 + 0.14 * H + sin(t * 0.9) * 0.03 * H, 0.18 * H * Math.min(1, (trip - 0.3) * 4));
  drawDudeBubble();
  drawDrop();
  cv.restore();
  drawJet();
  todOverlay();
  if (trip > 0.02) tripFx(trip * 0.7);
  if (blurAmt > 0.01) blurFx(smooth(blurAmt));
  drawVignette();
  drawStation();
  drawOfferScene();
  drawHud();
  requestAnimationFrame(frame);
}

function drawSky() {
  const g = cv.createLinearGradient(0, 0, 0, OY + H * 0.5);
  g.addColorStop(0, hex(TOD.sky[0])); g.addColorStop(0.6, hex(TOD.sky[1])); g.addColorStop(1, hex(TOD.sky[2]));
  cv.fillStyle = g; cv.fillRect(0, 0, SW, OY + H * 0.62);
  drawCelestial();

function drawSkyline() {

function drawFacades() {

  for (let i = i0; i <= i1; i++) {
    const x0 = (i * slot - off) * H, w = slot * H;
    const kind = DISTRICTS[districtAt(i * slot)].kind;
    if (kind !== "shop") { if (x0 + (kind === "temple" ? 5 : 3) * w > -0.1 * H) { DRAWERS[kind](x0, w, i, topLimit); if (isSeven(i, kind) && x0 + w > -0.1 * H && x0 < W + 0.1 * H) sevenEleven(x0, w, i); } continue; }
    if (x0 + w < -0.1 * H || x0 > W + 0.1 * H) continue;
    const tower = rnd(i, 91) > 0.82;
    const floors = tower ? 8 + ((rnd(i, 92) * 9) | 0) : 2 + ((rnd(i, 93) * 5) | 0);
    const fh = 0.16, base = 0.45;

  }
}

function eventFn(j) {
  if (rnd(j, 140) < 0.08) return null;

}

function drawEvents() {
  const off = camX * FAC;
  const j0 = Math.floor(off / SLOT) - 1, j1 = j0 + Math.floor(W / H / SLOT) + 3;
  for (let j = j0; j <= j1; j++) {

function liftPose() {
  if (liftT < 0) return null;
  const T = liftT, dist = Math.max(0.04, px - sx - 0.15);
  const f = T < 0.15 || T > 2.95 ? 1 : -1;
  let dx = -dist, lean = 0, cr = 0, walk = 0, reach = 0;
  if (T < 1.0) { dx = -dist * smooth((T - 0.3) / 0.7); walk = T > 0.3 ? 1 : 0; }
  else if (T > 3.0) { dx = -dist * (1 - smooth((T - 3.0) / 0.6)); walk = 1; }
  if (T >= 1.0 && T < 1.5) { const k = smooth((T - 1.0) / 0.5); lean = 1.0 * k; cr = 0.2 * k; reach = k; }
  else if (T >= 1.5 && T < 2.5) { const k = smooth((T - 1.5) / 1.0); lean = lerp(1.0, 0.25, k); cr = lerp(0.2, 0.03, k); reach = 1; }
  else if (T >= 2.5 && T < 2.85) { const k = smooth((T - 2.5) / 0.35); lean = 0.25 * (1 - k); cr = 0.03 * (1 - k); reach = 1 - k; }
  return { f, dx, lean, cr, walk, reach };
}

function armIK(sx0, sy0, tx, ty, L) {
  let dx = tx - sx0, dy = ty - sy0, d = Math.hypot(dx, dy);
  if (d > 2 * L * 0.999) { const k = 2 * L * 0.999 / d; dx *= k; dy *= k; d = 2 * L * 0.999; }
  const base = Math.atan2(dy, dx), a = Math.acos(clamp(d / (2 * L), -1, 1));
  return [sx0 + cos(base - a) * L, sy0 + sin(base - a) * L, sx0 + dx, sy0 + dy];
}

function act(k, lt) {
  const a = k % 7;
  if (a === 0) return STAND;
  if (a === 1) return waveP(lt);
  if (a === 2) { const P = STAND.slice(); P[7] = 1.4; P[8] = 0.3 + 0.2 * sin(lt * 2); return P; }
  if (a === 3) { const P = STAND.slice(); P[7] = 2.6; P[8] = 2.4; P[11] = 0.15; return P; }
  if (a === 4) return mod(lt, 3) < 1.2 ? DRINK : STAND;
  if (a === 5) { const P = STAND.slice(); P[0] = 0.3; P[7] = 1.2; P[8] = 0.6; P[11] = 0.3; return P; }
  return walkP(lt * 3, false);
}

function playGenre(g, s, t0, st) {

    if (q !== 0) bass(r + (sp === 15 ? 12 : 0), t0, st * 0.5);

function playStep(s, t0, st) {
